# Installed by install.sh as /etc/systemd/journald.conf.d/alcove-relay.conf.
# The relay's coturn and registrar output reaches the host's journal, and this is
# the one place its retention is set. MaxRetentionSec applies to archived journal
# files only, so MaxFileSec archives the active file daily: an entry is deleted
# within MaxRetentionSec plus MaxFileSec, the period PRIVACY.md and the note state.
[Journal]
Storage=persistent
MaxRetentionSec=90day
MaxFileSec=1day
