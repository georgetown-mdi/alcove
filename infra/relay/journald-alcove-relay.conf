# Installed by install.sh as /etc/systemd/journald.conf.d/alcove-relay.conf.
# The relay's coturn and registrar output reaches the host's journal, and this is
# the one place the age limit on it is set. journald applies it to the whole
# journal of the host, which the reference deployment dedicates to the relay.
[Journal]
MaxRetentionSec=90day
