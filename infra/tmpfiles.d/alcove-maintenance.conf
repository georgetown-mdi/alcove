# The directory of the relay host's maintenance lock, /run/alcove-maintenance/lock.
# Only root can open a file under a 0700 root directory, so no other account can
# hold the lock. The install scripts install this file as
# /etc/tmpfiles.d/alcove-maintenance.conf and run systemd-tmpfiles --create on it.
d /run/alcove-maintenance 0700 root root -
