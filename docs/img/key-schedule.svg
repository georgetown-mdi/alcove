<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" role="img"><title>Alcove key schedule</title><desc>An SP 800-56C KDF runs over the P-256 ECDH result. The PSK, the transcript hash and one block of that KDF output feed the Noise handshake state, which yields the session key for per-direction AEAD keys and the confirmation tags. A second block of the KDF output, with a random share from each side, yields the next PSK.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#888780}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}
.c-teal .ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/>
<rect class="box" x="40" y="40" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="57" text-anchor="middle" dominant-baseline="central">Pre-shared key</text>
<text class="ts" x="130" y="76" text-anchor="middle" dominant-baseline="central">256-bit, rotated each run</text>
<rect class="box" x="250" y="40" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="57" text-anchor="middle" dominant-baseline="central">Transcript hash</text>
<text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">SHA-256, hellos + key shares</text>
<rect class="box" x="460" y="40" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="57" text-anchor="middle" dominant-baseline="central">Ephemeral P-256 keys</text>
<text class="ts" x="550" y="76" text-anchor="middle" dominant-baseline="central">fresh per run</text>
<line x1="550" y1="92" x2="550" y2="130" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="460" y="132" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="149" text-anchor="middle" dominant-baseline="central">ECDH, then KDF</text>
<text class="ts" x="550" y="168" text-anchor="middle" dominant-baseline="central">SP 800-56C, HKDF-SHA-256</text>
<line x1="130" y1="92" x2="130" y2="222" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="92" x2="340" y2="222" class="arr" marker-end="url(#arrow)"/>
<path d="M505 184 L505 258 L432 258" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="224" width="390" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="235" y="242" text-anchor="middle" dominant-baseline="central">Noise handshake state (HKDF-SHA-256)</text>
<text class="ts" x="235" y="262" text-anchor="middle" dominant-baseline="central">PSK mixed first, ECDH output last</text>
<text class="ts" x="235" y="279" text-anchor="middle" dominant-baseline="central">transcript hash bound into each output</text>
<line x1="130" y1="292" x2="130" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="292" x2="340" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="184" x2="550" y2="330" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal">
<rect x="40" y="332" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="349" text-anchor="middle" dominant-baseline="central">Session key</text>
<text class="ts" x="130" y="368" text-anchor="middle" dominant-baseline="central">AEAD key per direction</text>
</g>
<g class="c-teal">
<rect x="250" y="332" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="349" text-anchor="middle" dominant-baseline="central">Confirmation tags</text>
<text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">HMAC-SHA-256, per role</text>
</g>
<g class="c-teal">
<rect x="460" y="332" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="349" text-anchor="middle" dominant-baseline="central">Next PSK</text>
<text class="ts" x="550" y="368" text-anchor="middle" dominant-baseline="central">+ random share per side</text>
</g>
<rect class="box" x="40" y="412" width="600" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="60" y="430" dominant-baseline="central">Relation to Noise</text>
<text class="ts" x="60" y="450" dominant-baseline="central">Built on the NNpsk0 pattern, with an SP 800-56C KDF on the DH output and explicit key confirmation</text>
<text class="ts" x="60" y="466" dominant-baseline="central">Not wire-compatible with Noise; behavior pinned by known-answer test vectors</text>
<rect class="box" x="40" y="505" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="62" y="512" dominant-baseline="central">Input or derivation step</text>
<rect class="c-teal" x="250" y="505" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="272" y="512" dominant-baseline="central">Key or value the exchange uses</text>
</svg>
