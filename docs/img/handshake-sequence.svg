<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 904" role="img"><title>Alcove handshake and end-to-end encryption sequence</title><desc>A Noise NNpsk0-pattern handshake over P-256 with explicit key confirmation, followed by AES-256-GCM per-direction encryption of the terms exchange, PSI rounds, payload and optional signed receipt. The initiator sends its rotation share in handshake message 3 and the responder sends its share with its terms reply; the initiator stores the rotated PSK first, and the responder stores it once the initiator agrees to proceed.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#888780}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.lifeline{stroke:#888780;stroke-width:0.5;stroke-dasharray:4 4}
rect.c-gray{fill:#F1EFE8;stroke:#888780}
rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="904" fill="#FFFFFF"/>
<rect class="box" x="40" y="20" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Noise NNpsk0 pattern over P-256 / SHA-256, plus key confirmation</text>
<text class="ts" x="340" y="58" text-anchor="middle" dominant-baseline="central">Not wire-compatible with Noise; derivation in the key schedule diagram</text>
<rect class="c-gray" x="40" y="176" width="600" height="340" rx="8" stroke-width="0.5"/>
<rect class="c-teal" x="40" y="604" width="600" height="248" rx="8" stroke-width="0.5"/>
<rect class="box" x="40" y="100" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="118" text-anchor="middle" dominant-baseline="central">Initiator</text>
<text class="ts" x="120" y="138" text-anchor="middle" dominant-baseline="central">holds PSK</text>
<rect class="box" x="480" y="100" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="118" text-anchor="middle" dominant-baseline="central">Responder</text>
<text class="ts" x="560" y="138" text-anchor="middle" dominant-baseline="central">holds PSK</text>
<line class="lifeline" x1="120" y1="156" x2="120" y2="340"/>
<line class="lifeline" x1="120" y1="396" x2="120" y2="852"/>
<line class="lifeline" x1="560" y1="156" x2="560" y2="232"/>
<line class="lifeline" x1="560" y1="288" x2="560" y2="448"/>
<line class="lifeline" x1="560" y1="504" x2="560" y2="852"/>
<text class="ts" x="340" y="204" text-anchor="middle" dominant-baseline="central">1. Ephemeral P-256 key  (Noise: psk, e)</text>
<line x1="120" y1="216" x2="556" y2="216" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="432" y="232" width="192" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="528" y="250" text-anchor="middle" dominant-baseline="central">Derive keys</text>
<text class="ts" x="528" y="270" text-anchor="middle" dominant-baseline="central">PSK + ECDH + transcript</text>
<text class="ts" x="340" y="312" text-anchor="middle" dominant-baseline="central">2. Ephemeral P-256 key + confirmation tag  (Noise: e, ee)</text>
<line x1="560" y1="324" x2="124" y2="324" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="56" y="340" width="192" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="152" y="358" text-anchor="middle" dominant-baseline="central">Derive keys</text>
<text class="ts" x="152" y="378" text-anchor="middle" dominant-baseline="central">verify tag, else abort</text>
<text class="ts" x="340" y="420" text-anchor="middle" dominant-baseline="central">3. Confirmation tag + rotation share (AES-KW wrapped)</text>
<line x1="120" y1="432" x2="556" y2="432" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="432" y="448" width="192" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="528" y="466" text-anchor="middle" dominant-baseline="central">Verify tag</text>
<text class="ts" x="528" y="486" text-anchor="middle" dominant-baseline="central">abort on mismatch</text>
<rect class="box" x="140" y="532" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="550" text-anchor="middle" dominant-baseline="central">AES-256-GCM, one key per direction</text>
<text class="ts" x="340" y="570" text-anchor="middle" dominant-baseline="central">IV from sequence number; replay and reordering rejected</text>
<text class="ts" x="340" y="632" text-anchor="middle" dominant-baseline="central">Terms: rules, record counts, certificates + responder's rotation share</text>
<line x1="124" y1="644" x2="556" y2="644" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="box" x="140" y="660" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="678" text-anchor="middle" dominant-baseline="central">Rotated PSK stored, initiator first</text>
<text class="ts" x="340" y="698" text-anchor="middle" dominant-baseline="central">responder stores once the initiator agrees to proceed</text>
<text class="ts" x="340" y="744" text-anchor="middle" dominant-baseline="central">PSI matching rounds</text>
<line x1="124" y1="756" x2="556" y2="756" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="784" text-anchor="middle" dominant-baseline="central">Payload columns for matched records</text>
<line x1="124" y1="796" x2="556" y2="796" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="824" text-anchor="middle" dominant-baseline="central">Signed receipt, ECDSA P-256 (optional)</text>
<line x1="124" y1="836" x2="556" y2="836" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="c-gray" x="40" y="873" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="62" y="880" dominant-baseline="central">Outside the AEAD: authenticated handshake</text>
<rect class="c-teal" x="380" y="873" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="402" y="880" dominant-baseline="central">Inside the AEAD, end to end</text>
</svg>
