name: Temporary FIPS architecture comparison

# One-off measurement for the FIPS base move: builds Dockerfile.fips natively
# on amd64 and arm64 without a layer cache, checks each image against the
# committed attribution list, and prints the readings the move obliges. It is
# removed in the commit that records its results.
on:
  pull_request:
    branches: [staging]
    paths:
      - ".github/workflows/tmp_fips_arch_compare.yaml"

permissions:
  contents: read

jobs:
  measure:
    name: Measure the FIPS image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Build without a layer cache
        run: |
          date -u +%F
          uname -m
          docker build --no-cache --platform "linux/${{ matrix.arch }}" -f Dockerfile.fips -t alcove:fips-measure .

      - name: Check against the committed list
        run: node scripts/generate-os-package-attribution.mjs fips --image alcove:fips-measure --check

      - name: Print the package query
        if: ${{ !cancelled() }}
        run: |
          echo "=== BEGIN RPM QUERY ${{ matrix.arch }} ==="
          docker run --rm --platform "linux/${{ matrix.arch }}" --entrypoint rpm alcove:fips-measure \
            -qa --qf '%{NAME}\t%|EPOCH?{%{EPOCH}}:{0}|\t%{VERSION}\t%{RELEASE}\t%{ARCH}\t%{LICENSE}\n' | sort
          echo "=== END RPM QUERY ${{ matrix.arch }} ==="

      - name: Print the readings
        if: ${{ !cancelled() }}
        run: |
          echo "=== READINGS ${{ matrix.arch }} ==="
          echo "date: $(date -u +%F)"
          echo "size: $(docker image inspect --format '{{.Size}}' alcove:fips-measure)"
          docker run --rm --platform "linux/${{ matrix.arch }}" --entrypoint cat alcove:fips-measure /etc/os-release | grep -E '^(VERSION_ID|VERSION)='
          echo "node openssl: $(docker run --rm --platform "linux/${{ matrix.arch }}" --entrypoint node alcove:fips-measure -p process.versions.openssl)"
          echo "openssl version: $(docker run --rm --platform "linux/${{ matrix.arch }}" --entrypoint openssl alcove:fips-measure version)"
          echo "setuid/setgid:"
          docker run --rm --platform "linux/${{ matrix.arch }}" --user 0 --entrypoint sh alcove:fips-measure -c 'find / -xdev -type f \( -perm -2000 -o -perm -4000 \) -exec ls -l {} +'
          echo "=== END READINGS ${{ matrix.arch }} ==="
