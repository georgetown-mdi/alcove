name: Temporary FIPS base measurement

# One-off measurement for the FIPS base move: resolves the candidate Amazon
# Linux 2023 base on ECR Public, reads the release and the ca-certificates it
# holds and serves, then builds Dockerfile.fips at that base natively on amd64
# and arm64 without a layer cache, prints the readings the move obliges, and
# scans the built image. It is removed in the commit that records its results.
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Tag of public.ecr.aws/amazonlinux/amazonlinux whose index digest to build on"
        required: false
        default: "2023"
  pull_request:
    branches: [staging]
    paths:
      - ".github/workflows/tmp_fips_base_measure.yaml"

permissions:
  contents: read

env:
  BASE_REPOSITORY: public.ecr.aws/amazonlinux/amazonlinux

jobs:
  resolve:
    name: Resolve the candidate base
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
      release: ${{ steps.candidate.outputs.release }}
      node_version: ${{ steps.node.outputs.node_version }}
      node_sha256_x64: ${{ steps.node.outputs.node_sha256_x64 }}
      node_sha256_arm64: ${{ steps.node.outputs.node_sha256_arm64 }}
    env:
      CANDIDATE_TAG: ${{ inputs.candidate_tag || '2023' }}
    steps:
      - uses: actions/checkout@v7

      - name: List the dated 2023 tags
        run: |
          set -euo pipefail
          mkdir -p report
          if command -v skopeo >/dev/null; then
            skopeo list-tags "docker://${BASE_REPOSITORY}" | jq -r '.Tags[]' > report/tags.txt
          else
            token="$(curl -fsSL https://public.ecr.aws/token/ | jq -r .token)"
            curl -fsSL -H "Authorization: Bearer ${token}" \
              "https://public.ecr.aws/v2/amazonlinux/amazonlinux/tags/list?n=1000" | jq -r '.tags[]' > report/tags.txt
          fi
          grep -E '^2023\.[0-9]+\.[0-9]{8}(\.[0-9]+)?$' report/tags.txt | sort -V > report/dated-tags.txt
          echo "=== BEGIN DATED TAGS (newest 12) ==="
          tail -n 12 report/dated-tags.txt
          echo "=== END DATED TAGS ==="

      - name: Resolve index digests and read each rootfs
        run: |
          set -euo pipefail
          {
            echo "=== BEGIN TAG DIGESTS ==="
            echo "date: $(date -u +%FT%TZ)"
            for tag in "${CANDIDATE_TAG}" 2023 $(tail -n 6 report/dated-tags.txt | tac); do
              digest="$(docker buildx imagetools inspect "${BASE_REPOSITORY}:${tag}" --format '{{json .Manifest}}' | jq -r .digest)"
              packages="$(docker run --rm --platform linux/amd64 "${BASE_REPOSITORY}@${digest}" \
                rpm -q system-release ca-certificates openssl-libs openssl-fips-provider-latest | tr '\n' ' ')"
              echo "${tag} ${digest} amd64: ${packages}"
            done
            echo "=== END TAG DIGESTS ==="
            echo "=== BEGIN CANDIDATE INDEX ${CANDIDATE_TAG} ==="
            docker buildx imagetools inspect "${BASE_REPOSITORY}:${CANDIDATE_TAG}"
            echo "=== END CANDIDATE INDEX ==="
          } | tee report/tag-digests.txt

      - name: Name the candidate
        id: candidate
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${BASE_REPOSITORY}:${CANDIDATE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          release="$(docker run --rm --platform linux/amd64 "${BASE_REPOSITORY}@${digest}" rpm -q --qf '%{VERSION}' system-release)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${release}" =~ ^2023\.[0-9]+\.[0-9]{8}$ ]]
          echo "candidate: ${CANDIDATE_TAG} ${digest} release ${release}" | tee report/candidate.txt
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "release=${release}" >> "${GITHUB_OUTPUT}"

      - name: Read what the candidate snapshot and the newest release serve
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          RELEASE: ${{ steps.candidate.outputs.release }}
        run: |
          set -euo pipefail
          {
            echo "=== BEGIN SNAPSHOT ${RELEASE} ==="
            docker run --rm --platform linux/amd64 -e RELEASE "${BASE_REPOSITORY}@${DIGEST}" sh -c '
              echo "--- served at ${RELEASE}"
              dnf -q --releasever="${RELEASE}" --showduplicates list ca-certificates openssl-fips-provider-certified openssl-fips-provider-latest || true
              echo "--- advisory for CVE-2026-114406 at ${RELEASE}"
              dnf -q --releasever="${RELEASE}" updateinfo info --cve CVE-2026-114406 || true
              echo "--- newer releases"
              dnf check-release-update 2>&1 || true
              echo "--- served at latest"
              dnf -q --releasever=latest --showduplicates list ca-certificates || true
              echo "--- advisory for CVE-2026-114406 at latest"
              dnf -q --releasever=latest updateinfo info --cve CVE-2026-114406 || true
            '
            echo "=== END SNAPSHOT ==="
          } 2>&1 | tee report/snapshot.txt

      - name: Scan the candidate base rootfs
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BASE_REPOSITORY }}@${{ steps.candidate.outputs.digest }}
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Read the current Node 26 release
        id: node
        run: |
          set -euo pipefail
          mkdir -p node
          cd node
          version="$(curl -fsSL https://nodejs.org/dist/index.json | jq -r '[.[] | select(.version | startswith("v26."))][0].version')"
          [[ "${version}" =~ ^v26\.[0-9]+\.[0-9]+$ ]]
          echo "=== BEGIN NODE ==="
          echo "pinned: $(grep -E '^ARG NODE_VERSION=' ../Dockerfile.fips)"
          echo "current v26: ${version}"
          curl -fsSLO "https://nodejs.org/dist/${version}/SHASUMS256.txt"
          curl -fsSLO "https://nodejs.org/dist/${version}/SHASUMS256.txt.sig"
          for arch in x64 arm64; do
            file="node-${version}-linux-${arch}.tar.xz"
            curl -fsSLO "https://nodejs.org/dist/${version}/${file}"
            listed="$(awk -v f="${file}" '$2 == f { print $1 }' SHASUMS256.txt)"
            measured="$(sha256sum "${file}" | awk '{ print $1 }')"
            echo "${arch}: SHASUMS256.txt ${listed} sha256sum ${measured}"
            [[ "${listed}" =~ ^[0-9a-f]{64}$ ]]
            test "${listed}" = "${measured}"
            echo "node_sha256_${arch}=${measured}" >> "${GITHUB_OUTPUT}"
          done
          echo "node_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "--- signature over SHASUMS256.txt (nodejs/release-keys pubring)"
          curl -fsSLo pubring.kbx https://github.com/nodejs/release-keys/raw/HEAD/gpg/pubring.kbx \
            && gpgv --keyring "${PWD}/pubring.kbx" SHASUMS256.txt.sig SHASUMS256.txt 2>&1 || echo "signature verification did not complete"
          echo "=== END NODE ==="
          cp SHASUMS256.txt ../report/

      - name: Keep the resolve report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fips-resolve
          path: report/

  measure:
    name: Measure the FIPS image (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      DIGEST: ${{ needs.resolve.outputs.digest }}
      RELEASE: ${{ needs.resolve.outputs.release }}
      NODE_VERSION: ${{ needs.resolve.outputs.node_version }}
      NODE_SHA256_X64: ${{ needs.resolve.outputs.node_sha256_x64 }}
      NODE_SHA256_ARM64: ${{ needs.resolve.outputs.node_sha256_arm64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Point the runner's Dockerfile.fips at the candidate
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${RELEASE}" =~ ^2023\.[0-9]+\.[0-9]{8}$ ]]
          [[ "${NODE_VERSION}" =~ ^v26\.[0-9]+\.[0-9]+$ ]]
          [[ "${NODE_SHA256_X64}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${NODE_SHA256_ARM64}" =~ ^[0-9a-f]{64}$ ]]
          sed -i -E \
            -e "s#^(FROM public\.ecr\.aws/amazonlinux/amazonlinux@)sha256:[0-9a-f]{64}( AS nodebase)#\1${DIGEST}\2#" \
            -e "s#^ARG AL2023_RELEASEVER=.*#ARG AL2023_RELEASEVER=${RELEASE}#" \
            -e "s#^ARG NODE_VERSION=.*#ARG NODE_VERSION=${NODE_VERSION}#" \
            -e "s#(x86_64\) node_arch=x64; node_sha256=)[0-9a-f]{64}#\1${NODE_SHA256_X64}#" \
            -e "s#(aarch64\) node_arch=arm64; node_sha256=)[0-9a-f]{64}#\1${NODE_SHA256_ARM64}#" \
            Dockerfile.fips
          git diff Dockerfile.fips

      - name: Read the candidate rootfs on this architecture
        run: |
          mkdir -p measure
          docker run --rm --platform "linux/${ARCH}" "${BASE_REPOSITORY}@${DIGEST}" \
            rpm -q system-release ca-certificates openssl-libs openssl-fips-provider-latest | tee "measure/base-rootfs-${ARCH}.txt"

      - name: Build without a layer cache
        run: |
          set -o pipefail
          date -u +%F
          uname -m
          docker info --format 'storage driver: {{.Driver}} {{json .DriverStatus}}'
          docker build --no-cache --progress=plain --platform "linux/${ARCH}" -f Dockerfile.fips -t alcove:fips-measure . 2>&1 | tee "measure/build-${ARCH}.log"

      - name: Print the build assertions
        if: ${{ !cancelled() }}
        run: |
          echo "=== BUILD ASSERTIONS ${ARCH} ==="
          grep -E 'base rootfs release:|installed FIPS module comes from:|activated FIPS provider:|openssl-fips-provider|v26\.[0-9]+\.[0-9]+$' "measure/build-${ARCH}.log" | grep -v '^#[0-9]* \[' || true
          echo "=== END BUILD ASSERTIONS ${ARCH} ==="

      - name: Print the package query
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          docker run --rm --platform "linux/${ARCH}" --entrypoint rpm alcove:fips-measure \
            -qa --qf '%{NAME}\t%|EPOCH?{%{EPOCH}}:{0}|\t%{VERSION}\t%{RELEASE}\t%{ARCH}\t%{LICENSE}\n' | sort > "measure/rpm-query-${ARCH}.txt"
          echo "=== BEGIN RPM QUERY ${ARCH} ==="
          cat "measure/rpm-query-${ARCH}.txt"
          echo "=== END RPM QUERY ${ARCH} ==="

      - name: Compare with the committed list
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/generate-os-package-attribution.mjs fips --query-output "measure/rpm-query-${ARCH}.txt" --check

      - name: Print the readings
        if: ${{ !cancelled() }}
        run: |
          {
            echo "=== READINGS ${ARCH} ==="
            echo "date: $(date -u +%F)"
            echo "size: $(docker image inspect --format '{{.Size}}' alcove:fips-measure)"
            docker run --rm --platform "linux/${ARCH}" --entrypoint cat alcove:fips-measure /etc/os-release | grep -E '^(VERSION_ID|VERSION)='
            docker run --rm --platform "linux/${ARCH}" --entrypoint rpm alcove:fips-measure -q system-release ca-certificates openssl-libs openssl openssl-fips-provider-certified openssl-fips-provider-certified-so
            echo "node version: $(docker run --rm --platform "linux/${ARCH}" --entrypoint node alcove:fips-measure --version)"
            echo "node openssl: $(docker run --rm --platform "linux/${ARCH}" --entrypoint node alcove:fips-measure -p process.versions.openssl)"
            echo "openssl version: $(docker run --rm --platform "linux/${ARCH}" --entrypoint openssl alcove:fips-measure version)"
            echo "package count: $(wc -l < "measure/rpm-query-${ARCH}.txt")"
            echo "setuid/setgid:"
            docker run --rm --platform "linux/${ARCH}" --user 0 --entrypoint sh alcove:fips-measure -c 'find / -xdev -type f \( -perm -2000 -o -perm -4000 \) -exec ls -l {} +'
            echo "=== END READINGS ${ARCH} ==="
          } 2>&1 | tee "measure/readings-${ARCH}.txt"

      - name: Keep the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fips-measure-${{ matrix.arch }}
          path: measure/

      - name: Scan the built image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: alcove:fips-measure
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .github/trivyignore.yaml
          exit-code: "1"
          format: table
