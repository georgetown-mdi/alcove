name: Temporary FIPS base measurement

# One-off measurement for the FIPS base move: names the dated ECR Public tag
# the committed base digest matches, reads the base rootfs, then builds the
# committed Dockerfile.fips natively on amd64 and arm64 without a layer cache,
# keeps the package query, the regenerated attribution list, the OpenSSL and
# FIPS provider readings and the image scan as artifacts. It is removed in the
# commit that records its results.
on:
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      - ".github/workflows/tmp_fips_base_measure.yaml"

permissions:
  contents: read

env:
  BASE_REPOSITORY: public.ecr.aws/amazonlinux/amazonlinux

jobs:
  resolve:
    name: Resolve the committed base
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_LOGIN == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read the committed pins
        id: pins
        run: |
          set -euo pipefail
          mkdir -p report
          digest="$(sed -n -E 's#^FROM public\.ecr\.aws/amazonlinux/amazonlinux@(sha256:[0-9a-f]{64}) AS nodebase$#\1#p' Dockerfile.fips)"
          release="$(sed -n -E 's#^ARG AL2023_RELEASEVER=(.*)$#\1#p' Dockerfile.fips)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${release}" =~ ^2023\.[0-9]+\.[0-9]{8}$ ]]
          echo "committed: ${digest} release ${release}" | tee report/committed.txt
          grep -E '^ARG FIPS_(PROVIDER_PACKAGE|PROVIDER_VERSION|MODULE_VERSION)=' Dockerfile.fips | tee -a report/committed.txt
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "release=${release}" >> "${GITHUB_OUTPUT}"

      - name: List the dated 2023 tags
        run: |
          set -euo pipefail
          if command -v skopeo >/dev/null; then
            skopeo list-tags "docker://${BASE_REPOSITORY}" | jq -r '.Tags[]' > report/tags.txt
          else
            token="$(curl -fsSL https://public.ecr.aws/token/ | jq -r .token)"
            curl -fsSL -H "Authorization: Bearer ${token}" \
              "https://public.ecr.aws/v2/amazonlinux/amazonlinux/tags/list?n=1000" | jq -r '.tags[]' > report/tags.txt
          fi
          grep -E '^2023\.[0-9]+\.[0-9]{8}(\.[0-9]+)?$' report/tags.txt | sort -V > report/dated-tags.txt
          echo "=== BEGIN DATED TAGS (newest 12) ==="
          tail -n 12 report/dated-tags.txt
          echo "=== END DATED TAGS ==="

      - name: Resolve index digests and read each rootfs
        env:
          DIGEST: ${{ steps.pins.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "=== BEGIN TAG DIGESTS ==="
            echo "date: $(date -u +%FT%TZ)"
            for tag in 2023 $(tail -n 6 report/dated-tags.txt | tac); do
              digest="$(docker buildx imagetools inspect "${BASE_REPOSITORY}:${tag}" --format '{{json .Manifest}}' | jq -r .digest)"
              marker=""
              if [ "${digest}" = "${DIGEST}" ]; then marker=" <- committed"; fi
              packages="$(docker run --rm --platform linux/amd64 "${BASE_REPOSITORY}@${digest}" \
                rpm -q system-release ca-certificates openssl openssl-libs openssl-fips-provider-latest | tr '\n' ' ')"
              echo "${tag} ${digest}${marker} amd64: ${packages}"
            done
            echo "=== END TAG DIGESTS ==="
            echo "=== BEGIN COMMITTED INDEX ${DIGEST} ==="
            docker buildx imagetools inspect "${BASE_REPOSITORY}@${DIGEST}"
            echo "=== END COMMITTED INDEX ==="
          } 2>&1 | tee report/tag-digests.txt

      - name: Read what the pinned snapshot serves
        env:
          DIGEST: ${{ steps.pins.outputs.digest }}
          RELEASE: ${{ steps.pins.outputs.release }}
        run: |
          set -euo pipefail
          {
            echo "=== BEGIN SNAPSHOT ${RELEASE} ==="
            docker run --rm --platform linux/amd64 -e RELEASE "${BASE_REPOSITORY}@${DIGEST}" sh -c '
              echo "--- served at ${RELEASE}"
              dnf -q --releasever="${RELEASE}" --showduplicates list openssl openssl-libs openssl-fips-provider-certified openssl-fips-provider-latest || true
              echo "--- newer releases"
              dnf check-release-update 2>&1 || true
            '
            echo "=== END SNAPSHOT ==="
          } 2>&1 | tee report/snapshot.txt

      - name: Scan the base rootfs
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BASE_REPOSITORY }}@${{ steps.pins.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .github/trivyignore.yaml
          exit-code: "1"
          format: table
          output: report/trivy-base.txt

      - name: Keep the resolve report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fips-resolve
          path: report/

  measure:
    name: Measure the FIPS image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_LOGIN == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Read the base rootfs on this architecture
        run: |
          set -euo pipefail
          mkdir -p measure
          digest="$(sed -n -E 's#^FROM public\.ecr\.aws/amazonlinux/amazonlinux@(sha256:[0-9a-f]{64}) AS nodebase$#\1#p' Dockerfile.fips)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker run --rm --platform "linux/${ARCH}" "${BASE_REPOSITORY}@${digest}" \
            rpm -q system-release ca-certificates openssl openssl-libs openssl-fips-provider-latest | tee "measure/base-rootfs-${ARCH}.txt"

      - name: Build without a layer cache
        run: |
          set -o pipefail
          date -u +%F | tee "measure/date-${ARCH}.txt"
          uname -m
          docker info --format 'storage driver: {{.Driver}} {{json .DriverStatus}}'
          docker build --no-cache --progress=plain --platform "linux/${ARCH}" -f Dockerfile.fips -t alcove:fips-measure . 2>&1 | tee "measure/build-${ARCH}.log"

      - name: Print the build assertions
        if: ${{ !cancelled() }}
        run: |
          {
            echo "=== BUILD ASSERTIONS ${ARCH} ==="
            grep -E 'base rootfs release:|installed FIPS module comes from:|activated FIPS provider:|openssl-fips-provider|v26\.[0-9]+\.[0-9]+$' "measure/build-${ARCH}.log" | grep -v '^#[0-9]* \[' || true
            echo "=== END BUILD ASSERTIONS ${ARCH} ==="
          } | tee "measure/assertions-${ARCH}.txt"

      - name: Print the package query
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          docker run --rm --platform "linux/${ARCH}" --entrypoint rpm alcove:fips-measure \
            -qa --qf '%{NAME}\t%|EPOCH?{%{EPOCH}}:{0}|\t%{VERSION}\t%{RELEASE}\t%{ARCH}\t%{LICENSE}\n' | sort > "measure/rpm-query-${ARCH}.txt"
          echo "=== BEGIN RPM QUERY ${ARCH} ==="
          cat "measure/rpm-query-${ARCH}.txt"
          echo "=== END RPM QUERY ${ARCH} ==="

      - name: Compare with the committed list
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/generate-os-package-attribution.mjs fips --query-output "measure/rpm-query-${ARCH}.txt" --check 2>&1 | tee "measure/drift-check-${ARCH}.txt"

      - name: Regenerate the attribution list
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          node scripts/generate-os-package-attribution.mjs fips --query-output "measure/rpm-query-${ARCH}.txt"
          cp NOTICE-os-packages-fips.tsv "measure/NOTICE-os-packages-fips-${ARCH}.tsv"

      - name: Print the readings
        if: ${{ !cancelled() }}
        run: |
          {
            echo "=== READINGS ${ARCH} ==="
            echo "date: $(date -u +%F)"
            echo "size: $(docker image inspect --format '{{.Size}}' alcove:fips-measure)"
            docker run --rm --platform "linux/${ARCH}" --entrypoint cat alcove:fips-measure /etc/os-release | grep -E '^(VERSION_ID|VERSION)='
            docker run --rm --platform "linux/${ARCH}" --entrypoint rpm alcove:fips-measure -q system-release ca-certificates openssl-libs openssl openssl-fips-provider-certified openssl-fips-provider-certified-so
            echo "node version: $(docker run --rm --platform "linux/${ARCH}" --entrypoint node alcove:fips-measure --version)"
            echo "node openssl: $(docker run --rm --platform "linux/${ARCH}" --entrypoint node alcove:fips-measure -p process.versions.openssl)"
            echo "openssl version: $(docker run --rm --platform "linux/${ARCH}" --entrypoint openssl alcove:fips-measure version)"
            echo "package count: $(wc -l < "measure/rpm-query-${ARCH}.txt")"
            echo "setuid/setgid:"
            docker run --rm --platform "linux/${ARCH}" --user 0 --entrypoint sh alcove:fips-measure -c 'find / -xdev -type f \( -perm -2000 -o -perm -4000 \) -exec ls -l {} +'
            echo "=== END READINGS ${ARCH} ==="
          } 2>&1 | tee "measure/readings-${ARCH}.txt"

      - name: Scan the built image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: alcove:fips-measure
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .github/trivyignore.yaml
          exit-code: "1"
          format: table
          output: measure/trivy-${{ matrix.arch }}.txt

      - name: Keep the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fips-measure-${{ matrix.arch }}
          path: measure/
