name: Deploy to Elastic Beanstalk

# Paused until Elastic Beanstalk is retired: the hosted build is a static site
# with no server process, so an environment this deploys to has nothing to
# start. The hosted app deploys through pages_deploy.yaml; this runs only by
# manual dispatch.
on:
  workflow_dispatch:

concurrency:
  # One dispatched deploy per branch at a time. cancel-in-progress is false:
  # cancelling a deploy mid-update can leave the environment inconsistent, so
  # an in-flight run finishes before the next one starts.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    uses: ./.github/workflows/eb_build_and_test.yaml

  # The Elastic Beanstalk source bundle: the gate's static site with the
  # apps/web/deploy/aws_eb/ payload and an empty .env copied over it.
  package:
    name: Package for Elastic Beanstalk
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ARTIFACT_NAME: ${{ format('{0}-{1}', vars.EB_APPLICATION_NAME, github.sha) }}
    outputs:
      artifactName: ${{ steps.artifact-name.outputs.artifactName }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Download the site
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-and-test.outputs.artifactName }}
          path: bundle
      - name: Package for Elastic Beanstalk
        run: |
          cp -a apps/web/deploy/aws_eb/. bundle
          touch bundle/.env
          (cd bundle && zip -r "../${GITHUB_SHA}.zip" .)
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.sha }}.zip
          compression-level: 0
      - name: Output artifact name
        id: artifact-name
        run: echo "artifactName=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: package
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/eb_deploy_reusable_action.yaml
    with:
      artifactName: ${{ needs.package.outputs.artifactName }}
      branchName: ${{ github.ref_name }}
    secrets: inherit
