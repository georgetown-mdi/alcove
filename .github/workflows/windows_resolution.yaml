name: Windows Path Resolution

# The file-drop guide's PowerShell script works out the real server, share and
# subfolder behind whatever an operator sees in File Explorer. Two of the
# environments it does that in -- a drive letter mapped to an SMB share, and a
# DFS namespace -- had never been tested anywhere. This workflow tests them on a
# throwaway windows-latest runner that serves itself the share.
#
# The jobs and their contracts:
#
#   test     Pester over the guide scripts' own functions, dot-sourced with
#            -LoadFunctionsOnly: the setup script's path resolution against the
#            rig below, and the launcher's verdict reader, release stamp and DFS
#            candidate selection, which need no rig and only Windows PowerShell.
#            Beside them, the accept sheet's commands, run under Windows
#            PowerShell 5.1 against a docker stand-in; the web unit
#            tests keep the file holding those commands equal to the sheet
#            generator's output, so a change to them reaches this job. The
#            docker lines README.md, docs/CONSOLE.md, and the console's
#            shared-folder notice print run the same way, from a file a
#            repository script test keeps equal to them.
#            It ASSERTS: a failed test fails the job. Runs on every pull request
#            touching the paths below.
#   clm      Both scripts run end to end in sessions a machine-wide policy has
#            put in ConstrainedLanguage: the setup script's refusal and the
#            launcher's typed folder prompts. Its own job because the policy
#            reaches every PowerShell started while it is set. It ASSERTS, on
#            the same pull requests as test.
#   measure The original measurement harness, which asks whether the runner can
#            host the rig at all and never fails. Kept for re-measuring, and run
#            only on manual dispatch -- an edit to that harness is checked by
#            dispatching this workflow, not by opening a pull request.
#
# The session reading a run can read check-run annotations and nothing else, so
# every job reports everything a reader needs as single-line annotations and
# nothing as log-only. The test and clm jobs emit one ::error per failed test, one
# ::notice summarising the counts and the Pester version, and one ::notice per
# rig assumption, so an infrastructure failure is distinguishable from a script
# that resolves a path wrongly. Read a run through its annotations:
#
#   gh api repos/<owner>/<repo>/check-runs/<check-run-id>/annotations
#
# No same-repo gate, unlike the workflows that hold credentials: the runner is a
# throwaway VM, the jobs read no secret, and the share, namespace and policy they
# create live and die inside that VM with nothing here elevated beyond what every
# windows-latest job already holds.
on:
  pull_request:
    branches: [main, staging]
    paths:
      - "support/windows-network-filedrop/Setup-AlcoveFileDrop.ps1"
      - "support/windows-network-filedrop/Start-Alcove.ps1"
      - "support/maintainer-notes/Setup-AlcoveFileDrop.Tests.ps1"
      - "support/maintainer-notes/Start-Alcove.Tests.ps1"
      - "support/maintainer-notes/ConstrainedLanguage.Tests.ps1"
      - "support/maintainer-notes/AcceptSheet.Tests.ps1"
      - "support/maintainer-notes/accept-sheet-commands.txt"
      - "support/maintainer-notes/DockerLines.Tests.ps1"
      - "support/maintainer-notes/DockerStandIn.ps1"
      - "support/maintainer-notes/docker-lines.txt"
      - "support/maintainer-notes/ci-resolution-tests.ps1"
      - "support/maintainer-notes/ci-capability-probe.ps1"
      - ".github/workflows/windows_resolution.yaml"
  workflow_dispatch:

# Cancel a superseded run when a newer commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only need their own checkout.
permissions:
  contents: read

jobs:
  test:
    name: Resolution functions against a live rig
    runs-on: windows-latest
    # Installing the DFS namespace role is the slow step; a hang there must not
    # hold a runner for the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Windows PowerShell 5.1 rather than pwsh: SmbShare, ServerManager, DFSN
      # and the script under test are all native there rather than reached
      # through a compatibility session. `powershell -File` under cmd states the
      # execution policy the run depends on instead of inheriting the image's.
      - name: Run the resolution suite
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\support\maintainer-notes\ci-resolution-tests.ps1

  clm:
    name: Scripts in constrained language mode
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The suite sets the policy itself, after the harness and Pester are
      # loaded, so this session keeps FullLanguage and drives the runs.
      - name: Run the constrained language suite
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\support\maintainer-notes\ci-resolution-tests.ps1 -Suite ConstrainedLanguage

  # Measures what the runner can host for the suites still to be written
  # (ci-capability-probe.ps1 names each question), and never fails. Runs on
  # pull requests as well as on dispatch so that its first run answers them;
  # whether it stays, and under which trigger, is decided from that run.
  probe:
    name: Probe runner capabilities
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Probe policy, scheduler, engine, accounts and console input
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\support\maintainer-notes\ci-capability-probe.ps1

  measure:
    name: Measure drive and namespace resolution
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # As above: the role install is the slow step and must not hold a runner for
    # the default six hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Windows PowerShell 5.1 for the reason the test job gives, and for the
      # WScript.Network COM surface that is this harness's subject matter.
      - name: Measure loopback share, mapped drive, and DFS namespace
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\support\maintainer-notes\ci-resolution-rig.ps1
