name: Deploy the Project Site

# Builds the project site from docs/ and site/ (`npm run site:build`,
# configured in site/.vitepress/config.mjs) and uploads it to its own
# Cloudflare Pages project by direct upload, the way pages_deploy.yaml uploads the web app. A
# pull request builds the site and uploads nothing; a push to staging uploads a
# preview deployment on the `staging` branch alias. Production is uploaded only
# by hand, by site_publish.yaml. The secrets and the variable it reads:
# infra/hosted/README.md, "The project site".
# The two path lists are the same: the sources the site build reads.
on:
  pull_request:
    branches: [main, staging]
    paths:
      - "docs/**"
      - "site/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE.md"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "scripts/lib/markdownFences.mjs"
      - "scripts/lib/markdownHeadings.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/actions/setup/**"
      - ".github/workflows/site_deploy.yaml"
  push:
    branches: [staging]
    paths:
      - "docs/**"
      - "site/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE.md"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "scripts/lib/markdownFences.mjs"
      - "scripts/lib/markdownHeadings.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/actions/setup/**"
      - ".github/workflows/site_deploy.yaml"
  workflow_dispatch:

# One run per ref: a newer push cancels an older run of the same branch, so
# only the newest commit deploys. Safe because a Pages deployment exists only
# once its upload completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARTIFACT_NAME: project-site-${{ github.sha }}

jobs:
  build:
    name: Build the project site
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifactName: ${{ steps.artifact-name.outputs.artifactName }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uncached off a pull request: a push or dispatch build is the one
      # deployed, so it installs from the lockfile rather than a cache entry
      # any run in the repository could have written.
      - name: Set up and build core
        uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name == 'pull_request' }}
      # Fails on a relative link to a Markdown page that does not exist.
      # Other relative links and anchors are checked by `npm run linkcheck`.
      - name: Build the site
        run: npm run site:build
      # Hidden files carry .well-known/security.txt.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: site/.vitepress/dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Output artifact name
        id: artifact-name
        run: echo "artifactName=${{ env.ARTIFACT_NAME }}" >> "$GITHUB_OUTPUT"

  # The only job of this workflow given the Cloudflare credentials, and it runs
  # only on a push or a dispatch on staging. As in pages_deploy.yaml,
  # it checks out the deploy tool's lockfile alone and runs no other
  # repository code: it installs wrangler from that lockfile, downloads the
  # site the build job built, and uploads it.
  deploy:
    name: Upload to Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Staging
    # The checkout of the deploy tool's lockfile.
    permissions:
      contents: read
    outputs:
      siteUrl: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out the deploy tool's lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/wrangler/package.json
            /.github/wrangler/package-lock.json
      - name: Install the deploy tool from its lockfile
        working-directory: .github/wrangler
        run: npm ci --no-audit --no-fund
      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifactName }}
          path: ${{ runner.temp }}/site
      # As in pages_deploy.yaml: wrangler gets the command as arguments with no
      # shell, the project name is a variable only a repository admin sets, the
      # branch is staging, the sha is hex and the path is the runner's, so none
      # can add an argument. Pinned to the same commit and wrangler.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          workingDirectory: .github/wrangler
          command: pages deploy ${{ runner.temp }}/site --project-name=${{ vars.CLOUDFLARE_SITE_PAGES_PROJECT }} --branch=staging --commit-hash=${{ github.sha }}

  # As in pages_deploy.yaml: a job of its own, since it runs repository code,
  # and no retry.
  check-security-txt:
    name: Check the served security.txt
    needs: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Check the site
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.siteUrl }}
        run: node scripts/check-served-security-txt.mjs
