name: Core Stress Tests

# Scheduled runs of the core PSI stress tier -- packages/core's `stress`
# vitest project (npm run test:stress -w packages/core). That tier is excluded
# from `npm run test` and from every PR gate so the merge-time path stays fast;
# the tests exercise the seclink fork's large-dataset path -- e.g.
# Server#createSetupMessage past the ~125k spread-argument cliff that once threw
# "Maximum call stack size exceeded" -- which is too heavy to run on every push.
# A schedule is where that coverage belongs, catching a regression in the
# large-N path without slowing the PR gate.
#
# Runs only on `schedule` and manual `workflow_dispatch` -- never on push or
# pull_request -- so the PR gate is unaffected. Two tiers share this file:
# nightly runs every file the `stress` project lists except the engine files
# named in WEEKLY_MINUTES below, which run weekly: each takes from 14 minutes to
# about three hours on a hosted runner. A stress file added under test/stress/
# joins the nightly tier without an edit. Each file runs in a job of its own,
# except the short files named in GROUPED, which share one.

on:
  schedule:
    # 04:17 UTC daily, the nightly tier: an hour clear of the weekly scans in
    # codeql.yaml and dependency_audit.yaml, and off the hour per GitHub's
    # guidance to avoid top-of-hour congestion on the shared scheduler. Two
    # GitHub behaviors to know: a `schedule` trigger only fires from the
    # workflow as it exists on the default branch, so no nightly runs until this
    # file lands there (use the manual dispatch below to exercise it before
    # then); and GitHub disables a scheduled workflow after ~60 days without
    # repo activity, emailing the last committer -- re-enable it from the
    # Actions tab if a long-quiet repo needs this guard back. The listing step
    # below reads the tier from the cron's day-of-week field: a cron with a day
    # of week is the weekly tier, one without is the nightly tier.
    - cron: "17 4 * * *"
    # 06:17 UTC Sunday, the weekly tier: clear of the 03:43-04:57 nightlies and
    # of the Monday 05:30-05:47 weekly scans, on the week's quietest day for
    # pull-request runs.
    - cron: "17 6 * * 0"
  # On-demand run, e.g. to confirm a stress fix without waiting for the schedule.
  workflow_dispatch:
    inputs:
      tier:
        description: "Which stress files to run"
        type: choice
        options: [all, nightly, weekly]
        default: all

# One stress run at a time per ref; do not cancel an in-flight run (it is doing
# real, minutes-long work) -- this only guards a manual dispatch racing a
# scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: these test jobs only need to read the repo.
permissions:
  contents: read

jobs:
  files:
    name: List the stress test files
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
      sha: ${{ steps.list.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A scheduled workflow otherwise takes the default branch, but staging
          # is promoted to main slowly, so checking out main here would catch a
          # regression late. staging is the branch this nightly exists to watch.
          # A manual dispatch runs the branch it is dispatched on.
          ref: ${{ github.event_name == 'schedule' && 'staging' || github.ref }}
      - uses: ./.github/actions/setup
      # Vitest lists the files, so the jobs below run exactly what the `stress`
      # project includes. Each job's limit is above the longest per-test limit
      # in its files, so a slow test fails on its own timeout instead of being
      # cut off; a new file whose test sets a longer one needs its own limit.
      # A named file the project no longer lists fails this step, so a rename
      # cannot drop a file from its tier.
      - name: List the files of the stress project
        id: list
        working-directory: packages/core
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          if [ -z "$SCHEDULE" ]; then
            tier=$DISPATCH_TIER
          else
            read -r _ _ _ _ day_of_week <<< "$SCHEDULE"
            if [ "$day_of_week" = "*" ]; then tier=nightly; else tier=weekly; fi
          fi
          export TIER=$tier
          jobs=$(npx vitest list --project stress --filesOnly --json | node -e '
            const { relative } = require("node:path");
            // Measured job walls on a hosted runner: psiRoundWalls 2 h 45 min
            // (per-test limit 241 min), wasmMaskingGrowth 14 to 21 min (31
            // min). The 270 minutes for psiRoundWalls cover one round, 2^22
            // (measured 2 h 44 min); its 2^23 round needs about 24 GiB, which
            // a hosted runner lacks, so WALLS_SIZES pins the job to 2^22.
            // streamedMatchLarge at 2^24, identifier-revealing: job 2 h 58
            // min; building the round 33.1 min (peak RSS 11557 MiB); the
            // match 144.8 min, WASM memory peak 860 MiB, heap peak 274 MiB,
            // peak RSS 2193 MiB. Its probe limits, each at least 1.5 times
            // its measured time rounded up to 5 min, are 50 min to build and
            // 220 to match; the job's 290 are those plus 1 of test margin and
            // 15 for setup, rounded up. It needs 13 GiB free.
            const WALLS_FILE = "test/stress/psiRoundWalls.stress.test.ts";
            const WALLS_SIZES = "4194304";
            const WEEKLY_MINUTES = {
              [WALLS_FILE]: 270,
              "test/stress/streamedMatchLarge.stress.test.ts": 290,
              "test/stress/wasmMaskingGrowth.stress.test.ts": 45,
            };
            // Each took 0.5 to 2.5 minutes as a job of its own.
            const GROUPED = [
              "test/stress/createSetupMessageLarge.stress.test.ts",
              "test/stress/findAllScanBudget.stress.test.ts",
              "test/stress/identifyIntersectionLarge.stress.test.ts",
              "test/stress/psiSetFraming.stress.test.ts",
              "test/stress/roundDedupPastMapLimit.stress.test.ts",
              "test/stress/standardizedFieldRowCount.stress.test.ts",
            ];
            // The longest nightly job measured 8 min 47 s (recordPastStringCap);
            // the longest nightly per-test limit is 41 min (inputPreparation).
            const NIGHTLY_MINUTES = 60;
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const files = JSON.parse(input)
                .map((each) => relative(process.cwd(), each.file))
                .sort();
              const missing = [...Object.keys(WEEKLY_MINUTES), ...GROUPED]
                .filter((name) => !files.includes(name));
              if (missing.length > 0)
                throw new Error(`the stress project lists no ${missing.join(", ")}`);
              const single = (file, minutes) => ({
                name: file,
                files: file,
                minutes,
                wallsSizes: file === WALLS_FILE ? WALLS_SIZES : "",
              });
              const weekly = files
                .filter((file) => file in WEEKLY_MINUTES)
                .map((file) => single(file, WEEKLY_MINUTES[file]));
              const nightly = [
                { name: "short files", files: GROUPED.join(" "), minutes: NIGHTLY_MINUTES },
                ...files
                  .filter((file) => !(file in WEEKLY_MINUTES) && !GROUPED.includes(file))
                  .map((file) => single(file, NIGHTLY_MINUTES)),
              ];
              const jobs = { all: [...nightly, ...weekly], nightly, weekly }[process.env.TIER];
              if (jobs === undefined)
                throw new Error(`no stress tier ${process.env.TIER}`);
              console.log(JSON.stringify(jobs));
            });
          ')
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  stress:
    name: Core PSI stress (${{ matrix.job.name }})
    needs: files
    runs-on: ubuntu-26.04
    # Sized per job in the listing step. Per-file wall times are in the verbose
    # output of each run.
    timeout-minutes: ${{ matrix.job.minutes }}
    strategy:
      # One failing job must not cancel the others' runs.
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.files.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the files job listed from, so staging moving between the
          # jobs cannot split the list from the runs.
          ref: ${{ needs.files.outputs.sha }}
      # Pins Node, installs from the lockfile, and builds @alcove/core so the
      # stress tests run against the compiled fork in dist/.
      - uses: ./.github/actions/setup
      # The verbose reporter prints each test's duration as it finishes; naming
      # a reporter replaces the config's list, so the skipped-test reporter is
      # named again.
      - name: Stress tests (core PSI)
        run: |
          set -euo pipefail
          read -ra files <<< "$STRESS_FILES"
          if [ -n "$WALLS_SIZES" ]; then export PSI_STRESS_WALLS_SIZES=$WALLS_SIZES; fi
          npm run test:stress -w packages/core -- \
            --reporter=verbose \
            --reporter=../../scripts/lib/skippedLegReporter.mjs \
            "${files[@]}"
        env:
          STRESS_FILES: ${{ matrix.job.files }}
          WALLS_SIZES: ${{ matrix.job.wallsSizes }}
          # Raise the createSetupMessage permutation run above the 200k local
          # default for heavier nightly coverage past the ~125k overflow cliff.
          # createSetupMessageLarge sets no timeout of its own, so the stress
          # project's 300s per-test timeout bounds it: that test is a synchronous
          # WASM call vitest cannot interrupt, so a value that pushes it past 300s
          # runs to completion and only then is marked failed. 250k took 90 s
          # and 124 s on hosted runners. Going higher needs that test to set a
          # longer timeout of its own.
          # PSI_STRESS_E2E_N (the full-round test) is intentionally left at its
          # 25k default -- a heavier end-to-end round costs minutes.
          PSI_STRESS_N: "250000"
