name: Nightly Core Stress Tests

# Scheduled nightly run of the core PSI stress tier -- packages/core's `stress`
# vitest project (npm run test:stress -w packages/core). That tier is excluded
# from `npm run test` and from every PR gate so the merge-time path stays fast;
# the tests exercise the seclink fork's large-dataset path -- e.g.
# Server#createSetupMessage past the ~125k spread-argument cliff that once threw
# "Maximum call stack size exceeded" -- which is too heavy to run on every push.
# A nightly schedule is where that coverage belongs, catching a regression in
# the large-N path without slowing the PR gate.
#
# Runs only on `schedule` and manual `workflow_dispatch` -- never on push or
# pull_request -- so the PR gate is unaffected. Each file the `stress` project
# lists runs in a job of its own, so a stress file added under test/stress/ is
# picked up here without an edit.

on:
  schedule:
    # 04:17 UTC nightly, an hour clear of the weekly scans in codeql.yaml and
    # dependency_audit.yaml, and off the hour per GitHub's guidance to avoid
    # top-of-hour congestion on the shared scheduler. Two GitHub behaviors
    # to know: a `schedule` trigger only fires from the workflow as it exists on the
    # default branch, so no nightly runs until this file lands there (use the manual
    # dispatch below to exercise it before then); and GitHub disables a scheduled
    # workflow after ~60 days without repo activity, emailing the last committer --
    # re-enable it from the Actions tab if a long-quiet repo needs this guard back.
    - cron: "17 4 * * *"
  # On-demand run, e.g. to confirm a stress fix without waiting for the schedule.
  workflow_dispatch:

# One stress run at a time per ref; do not cancel an in-flight run (it is doing
# real, minutes-long work) -- this only guards a manual dispatch racing the
# nightly schedule.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: these test jobs only need to read the repo.
permissions:
  contents: read

jobs:
  files:
    name: List the stress test files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      files: ${{ steps.list.outputs.files }}
      sha: ${{ steps.list.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A scheduled workflow otherwise takes the default branch, but staging
          # is promoted to main slowly, so checking out main here would catch a
          # regression late. staging is the branch this nightly exists to watch.
          ref: staging
      - uses: ./.github/actions/setup
      # Vitest lists the files, so the jobs below run exactly what the `stress`
      # project includes.
      - name: List the files of the stress project
        id: list
        working-directory: packages/core
        run: |
          set -euo pipefail
          files=$(npx vitest list --project stress --filesOnly --json | node -e '
            const { relative } = require("node:path");
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const files = JSON.parse(input)
                .map((each) => relative(process.cwd(), each.file))
                .sort();
              if (files.length === 0)
                throw new Error("the stress project lists no test files");
              console.log(JSON.stringify(files));
            });
          ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  stress:
    name: Core PSI stress (${{ matrix.file }})
    needs: files
    runs-on: ubuntu-latest
    # Above the longest per-test limit a stress file sets (psiRoundWalls, 240
    # minutes), so a slow test fails on its own timeout instead of being cut off
    # here. Per-file wall times are in the verbose output of each nightly run.
    timeout-minutes: 270
    strategy:
      # One failing file must not cancel the others' runs.
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.files.outputs.files) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the files job listed from, so staging moving between the
          # jobs cannot split the list from the runs.
          ref: ${{ needs.files.outputs.sha }}
      # Pins Node, installs from the lockfile, and builds @alcove/core so the
      # stress tests run against the compiled fork in dist/.
      - uses: ./.github/actions/setup
      # The verbose reporter prints each test's duration as it finishes; naming
      # a reporter replaces the config's list, so the skipped-test reporter is
      # named again.
      - name: Stress tests (core PSI)
        run: >-
          npm run test:stress -w packages/core --
          --reporter=verbose
          --reporter=../../scripts/lib/skippedLegReporter.mjs
          "$STRESS_FILE"
        env:
          STRESS_FILE: ${{ matrix.file }}
          # Raise the createSetupMessage permutation run above the 200k local
          # default for heavier nightly coverage past the ~125k overflow cliff.
          # createSetupMessageLarge sets no timeout of its own, so the stress
          # project's 300s per-test timeout bounds it: that test is a synchronous
          # WASM call vitest cannot interrupt, so a value that pushes it past 300s
          # runs to completion and only then is marked failed. At ~0.46ms/element
          # locally, 250k (~120s) leaves margin on a slower hosted runner. Going
          # higher needs that test to set a longer timeout of its own.
          # PSI_STRESS_E2E_N (the full-round test) is intentionally left at its
          # 25k default -- a heavier end-to-end round costs minutes.
          PSI_STRESS_N: "250000"
