name: Release
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Release dry run on {0}', github.ref_name) }}

on:
  push:
    # A release and its two prerelease forms (docs/RELEASES.md, Versioning).
    # The cosign identity pattern below admits these tags and no others,
    # held by `npm run check:release-signing`.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pins Node, installs from the lockfile, and builds @alcove/core.
      # Uncached: this job is the gate the publish job below depends on, so what
      # it tests is an install of the lockfile rather than a cache entry any run
      # in the repository could have written.
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - name: Build CLI
        run: npm run build -w apps/cli
      - name: Unit tests (core)
        run: npm test -w packages/core
      - name: Unit tests (CLI contract)
        run: npm test -w packages/cli-contract
      - name: Unit tests (CLI)
        run: npm run test:unit -w apps/cli

      # Integration tests exercise the real ssh2 SFTPWrapper contract the SFTP
      # adapter couples to (unit tests run against mocks). The dedicated CLI
      # workflow (cli_build_and_test.yaml) runs this suite on pull requests as
      # the merge gate; here it is the ship gate's safety check, since publish
      # needs this job. The suite is self-managing: a vitest globalSetup starts
      # the SFTP test server before the suite and stops it after, so no extra
      # setup step is needed. The ship gate runs the in-process backend; the
      # native sshd leg runs in the pull-request workflow.
      - name: Integration tests (CLI)
        run: npm run test:integration -w apps/cli

      # The WebRTC transport is a vitest project of its own, so the SFTP-backed
      # `integration` project above does not carry it; the ship gate runs it too,
      # or a publish would go out with the WebRTC channel untested.
      - name: WebRTC integration tests (CLI)
        run: npm run test:integration:webrtc -w apps/cli

      # The backend-agnostic integration files are a project of their own too, so
      # the `integration` project above does not carry them either; the ship gate
      # runs them for the same reason it runs the WebRTC ones.
      - name: Backend-agnostic integration tests (CLI)
        run: npm run test:integration:backend-agnostic -w apps/cli

  # Whether the pushed tag is on the newest release line, decided from the
  # repository's release tags by scripts/release-line.mjs. Three things read
  # this one answer: the pages job's production deploy, the `latest` and
  # `latest-fips` image tags, and the GitHub Release's Latest marker; a tag on
  # an older line leaves each where it is. A prerelease is never on the newest
  # line, and its second answer, `prerelease`, keeps the `X.Y` and `X.Y-fips`
  # tags where they are, marks the GitHub Release as a prerelease, and lets
  # the pages job deploy it. Every other job runs the same for either answer.
  release-line:
    name: Decide whether the tag is on the newest release line
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      newest: ${{ steps.decide.outputs.newest }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm ci: scripts/release-line.test.mjs loads the script from a copy with
      # no node_modules.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Compare the tag with the repository's release tags
        id: decide
        env:
          ALCOVE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-line.mjs >>"$GITHUB_OUTPUT"

  # The pushed tag must carry a good signature from a key in `allowed_signers`
  # as `main` holds it, never as the tag's own tree does, and must name the
  # commit this run builds. Every job that publishes, signs or deploys needs
  # publish, which needs this. No checkout and no repository code: the step
  # fetches the two refs into an empty repository and runs git alone.
  verify-tag:
    name: Verify the tag's signature against main's signers
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify the tag against allowed_signers on main
        id: verify
        env:
          ALCOVE_TAG: ${{ github.ref_name }}
          ALCOVE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          repo="${RUNNER_TEMP}/verify-tag"
          signers="${RUNNER_TEMP}/allowed_signers"
          git init --quiet "$repo"
          git -C "$repo" fetch --quiet --no-tags --depth=1 "$ALCOVE_REPOSITORY_URL" \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${ALCOVE_TAG}:refs/tags/${ALCOVE_TAG}"
          git -C "$repo" show refs/remotes/origin/main:allowed_signers >"$signers"
          # Matched against both, so the check holds whichever of the two a
          # tag push sets GITHUB_SHA to.
          object="$(git -C "$repo" rev-parse --verify "refs/tags/${ALCOVE_TAG}")"
          tagged="$(git -C "$repo" rev-parse --verify "refs/tags/${ALCOVE_TAG}^{commit}")"
          if [ "$GITHUB_SHA" != "$object" ] && [ "$GITHUB_SHA" != "$tagged" ]; then
            echo "::error::Tag ${ALCOVE_TAG} names ${tagged}, but this run builds ${GITHUB_SHA}."
            exit 1
          fi
          named="$(git -C "$repo" for-each-ref --format='%(tag)' "refs/tags/${ALCOVE_TAG}")"
          if [ "$named" != "$ALCOVE_TAG" ]; then
            echo "::error::Tag ${ALCOVE_TAG} is the signed tag object for ${named:-no tag}, not for ${ALCOVE_TAG}."
            exit 1
          fi
          git -C "$repo" -c gpg.ssh.allowedSignersFile="$signers" verify-tag "$ALCOVE_TAG"

  publish:
    name: Publish Docker image
    needs: [test, release-line, verify-tag]
    if: ${{ github.event_name == 'push' }}
    # Runs on Ubuntu 24.04; the dry-run job proves 26.04 before this moves.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The OIDC token Sigstore signs against, for both the keyless cosign
      # signature and the provenance attestation below.
      id-token: write
      # actions/attest-build-provenance's write to this repository's
      # attestation store.
      attestations: write
      # The image push: the login step below authenticates to ghcr.io with
      # this job's own token, so no long-lived registry credential is held.
      # The Docker Hub copy runs in the dockerhub job, under a token of its own.
      packages: write
    env:
      # A step's `if:` is not given the secrets context, so whether the Docker
      # Hub token is set reaches the login step below through this.
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    outputs:
      # The manifest-list digest, carried to the launcher job so the reference it
      # stamps and the reference cosign signs below are the same value. The
      # launchers run the default image alone; the dockerhub job copies both.
      digest: ${{ steps.build.outputs.digest }}
      fips_digest: ${{ steps.build_fips.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job builds the image from its own checkout rather than an artifact
      # from the test job, so it must re-verify the vendored tarball here too;
      # see .github/actions/setup for the same check ahead of the test job's build.
      - name: Verify vendored native tarball integrity
        run: sha256sum -c lib/openmined-psi.js-*.tgz.sha256

      # The check is dependency-free, so a plain pinned Node suffices -- no npm
      # ci or @alcove/core build (the ./.github/actions/setup prologue) needed.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The provenance half of the same pairing, for the same reason: this job
      # bakes these bytes into the published image, so the fork build they came
      # from is verified here and not only in the test job's setup prologue.
      # The marker committed beside the tarball arms it: armed, a non-zero
      # verifier exit fails the release ahead of every build and registry step
      # below; disarmed, it warns and the sidecar baseline stands.
      - name: Verify vendored native tarball provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:prebuild-provenance

      # Ahead of every build and push step below, because what it holds is a
      # property of the image those steps publish: the tag they publish it under
      # comes from the pushed git tag, while the accept kit inside it names the
      # version apps/cli/package.json carries at build time. A release whose two
      # disagree hands the partner a `docker run` line for a different build.
      - name: Check the release version against the pushed tag
        env:
          ALCOVE_TAG: ${{ github.ref_name }}
        run: npm run check:release-version

      # The QEMU and builder images and the default image's base come from
      # Docker Hub, which limits anonymous pulls per source IP, and hosted
      # runners share theirs; the FIPS variant's base comes from ECR Public,
      # pulled anonymously. The token reads public images only and publishes
      # nothing.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_LOGIN == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The emulator image, pinned by digest
      # where the action's default floats on `latest`. Dependabot moves the pin
      # in .github/builder-images/Dockerfile, and scripts/dockerhub-login.test.mjs
      # fails until both of this workflow's QEMU steps pass its digest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      # The BuildKit image, pinned by digest where the
      # action's default floats on `buildx-stable-1`. Dependabot moves the pin
      # in .github/builder-images/Dockerfile, and scripts/dockerhub-login.test.mjs
      # fails until all four setup-buildx-action steps, in this workflow and in
      # image_smoke.yaml, pass it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      # The scan gate, ahead of every registry step below on purpose: a release
      # whose image carries a fixable HIGH or CRITICAL vulnerability in an OS or
      # language package never reaches the registry at all, rather than being pushed
      # under `latest` and then withheld from signing. Nothing in this job has
      # authenticated to the registry it publishes to yet when it runs. The
      # publish sequence below holds the same property once the gate is past:
      # each image is signed and attested immediately after its own push, so the
      # window in which a published image is unsigned is that image's own signing
      # step and nothing else -- never another artifact's build.
      #
      # The scan needs an image to read, so this builds one single-arch and
      # loads it -- the same shape image_smoke.yaml uses for its pre-merge scan.
      # It is not the published artifact: the build-and-push step below builds
      # again from the same context, reusing this builder's own layer cache, and
      # that build is what is signed and attested. Both resolve the same
      # digest-pinned base and the same committed lockfile, so the package set
      # scanned is the package set published; byte-identical images are not
      # claimed and nothing here rests on that.
      #
      # No build in this job reads or writes the GitHub Actions layer cache
      # (type=gha), which other runs in the repository can write, so every
      # image here is built from this checkout and the pinned bases alone.
      #
      # It reads amd64 while the release publishes amd64 and arm64. The base is
      # one multi-arch index digest and the two architectures resolve the same
      # system package versions under it, so what this measures on one is what
      # ships on the other; a vulnerability in an architecture-specific binary
      # alone is outside it.
      - name: Build the release image for scanning (amd64, load into local Docker)
        id: default_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: alcove:release-candidate

      # The FIPS variant, built and loaded for the same reason, without the
      # shared layer cache, and gated by the same scanner below.
      #
      # Keyed to the default build having run rather than to `!cancelled()`
      # alone: a failure in an earlier gate -- the tarball integrity check, the
      # version check, the buildx setup this step needs a builder from -- leaves
      # default_build skipped, and this build skips with it instead of burning a
      # two-architecture build and reporting a second, spurious failure beside
      # the real one. A default build that ran and failed is the case the
      # sibling should survive, so both of its outcomes let this one through.
      - name: Build the FIPS variant image for scanning (amd64, load into local Docker)
        id: fips_build
        if: ${{ !cancelled() && (steps.default_build.outcome == 'success' || steps.default_build.outcome == 'failure') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.fips
          load: true
          push: false
          tags: alcove:fips-release-candidate

      # Same scanner, threshold and exception list as the pull-request gate in
      # image_smoke.yaml, which carries why each input is set the way it is.
      # This is the ship-gate half: a base image pinned months before the tag, or
      # a lockfile resolved as long ago, can have acquired a vulnerability since
      # the pull request that set it.
      #
      # One gate per published image, and both ahead of the login below, so a
      # fixable HIGH or CRITICAL in either package closure stops the whole
      # release rather than publishing the other artifact and withholding this
      # one. Each scan is keyed to its own build, and the variant's build runs
      # even after a default-build failure, so a failure in either build or
      # either gate still lets the surviving sibling build, scan, and report --
      # a blocked release reports what both images carry and the maintainer
      # bumps both pins in one pass instead of one per attempt.
      - name: Scan the release image for vulnerable packages
        id: vulnerability_scan
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: alcove:release-candidate
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .github/trivyignore.yaml
          exit-code: "1"
          format: table
          output: trivy-release-image.txt

      - name: Scan the release FIPS variant image for vulnerable packages
        id: fips_vulnerability_scan
        if: ${{ !cancelled() && steps.fips_build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: alcove:fips-release-candidate
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .github/trivyignore.yaml
          exit-code: "1"
          format: table
          output: trivy-release-image-fips.txt

      # What the gates concluded, on the run's summary page rather than only
      # inside this job's log, so a blocked release says on its own front page
      # what blocked it and which artifact it was. On a release that publishes,
      # the same summary is the record that both images were scanned before they
      # went out.
      - name: Record the scans in the run summary
        if: ${{ !cancelled() && (steps.vulnerability_scan.outcome != 'skipped' || steps.fips_vulnerability_scan.outcome != 'skipped') }}
        env:
          SCAN_OUTCOME: ${{ steps.vulnerability_scan.outcome }}
          FIPS_SCAN_OUTCOME: ${{ steps.fips_vulnerability_scan.outcome }}
        run: |
          set -euo pipefail
          report() {
            echo "### $1"
            echo
            echo "Gate outcome: **$2**."
            echo
            if [ -s "$3" ]; then
              echo '```'
              cat "$3"
              echo '```'
            else
              echo "The scanner left no report."
            fi
            echo
          }
          {
            echo "## Release image vulnerability scans"
            echo
            echo "Fixable HIGH and CRITICAL vulnerabilities in each image's OS and language packages, with the exceptions in \`.github/trivyignore.yaml\` applied."
            echo
            report "Default image" "$SCAN_OUTCOME" trivy-release-image.txt
            report "FIPS variant image" "$FIPS_SCAN_OUTCOME" trivy-release-image-fips.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Does the candidate's OWN shipped configuration engage the validated
      # module? This runs the copy INSIDE the image -- the same file the
      # variant's entrypoint runs at every container start -- against the amd64
      # candidate loaded above, and it fails unless fips.so is mapped into the
      # process, the five Alcove call shapes (AES-256-GCM, HKDF-SHA-256,
      # HMAC-SHA-256, SHA-256, P-256 ECDH) and the rotation's value draw and
      # AES-KW wrap all succeed, and both an MD5 digest and a below-minimum RSA
      # keygen -- which no FIPS provider serves -- fail beside them.
      # docs/COMPLIANCE.md frames that engagement as measured
      # rather than assumed, and image_smoke.yaml measures a pull request's
      # build: without this step nothing measures the artifact a tag publishes.
      #
      # Ahead of the login below for the reason the scans are: a candidate whose
      # crypto is not served by the module stops the release here rather than
      # being published under `latest-fips` and then disowned.
      #
      # It reads amd64 while the release publishes amd64 and arm64. Both
      # architectures resolve the same base index digest and the same committed
      # lockfile, and the certified provider package and the module version the
      # loader activates are pinned and asserted by the build itself, so the
      # configuration this measures on one is the configuration that ships on
      # the other; a failure to engage on the architecture it does not read is
      # outside it.
      - name: Assert the release FIPS variant image engages the FIPS provider
        if: ${{ !cancelled() && steps.fips_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node \
            alcove:fips-release-candidate /app/fips-probe/image-engagement.mjs

      # `latest` only for a tag on the newest release line. The flavor turns off
      # the action's own `latest` for a semver tag, so the release-line job's
      # answer is the only thing that adds it. `X.Y` only for a release, never
      # a prerelease, stated here rather than left to the action's own rule.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/georgetown-mdi/alcove
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.release-line.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.release-line.outputs.newest == 'true' }}

      # The variant's tags: the default image's with `-fips` appended, so an
      # operator with a FIPS obligation pulls the same version, major.minor or
      # floating reference under a suffix that names the posture, and
      # `latest-fips` on the newest release line only, as `latest` is.
      # Derived here rather than through a second metadata-action flavor, so what
      # the tags are is read off this file rather than off an action's rule for
      # which of them a suffix reaches. The `X.Y-fips` strip runs only when the
      # release-line job reports a release, `v<major>.<minor>.<patch>`, where it
      # is total; a prerelease is published under its exact version alone.
      - name: Derive the FIPS variant's tags
        id: fips_meta
        env:
          ALCOVE_TAG: ${{ github.ref_name }}
          ALCOVE_NEWEST_LINE: ${{ needs.release-line.outputs.newest }}
          ALCOVE_PRERELEASE: ${{ needs.release-line.outputs.prerelease }}
        run: |
          set -euo pipefail
          version="${ALCOVE_TAG#v}"
          {
            echo "tags<<ALCOVE_FIPS_TAGS"
            echo "ghcr.io/georgetown-mdi/alcove:${version}-fips"
            if [ "${ALCOVE_PRERELEASE}" = "false" ]; then
              echo "ghcr.io/georgetown-mdi/alcove:${version%.*}-fips"
            fi
            if [ "${ALCOVE_NEWEST_LINE}" = "true" ]; then
              echo "ghcr.io/georgetown-mdi/alcove:latest-fips"
            fi
            echo "ALCOVE_FIPS_TAGS"
          } >>"$GITHUB_OUTPUT"

      # Ahead of the first push rather than after the last one: every step after
      # a failed step is skipped, so an installer that fails behind a push is a
      # published image this job can no longer sign. Installing the tool while
      # nothing is published yet turns that case into a release that publishes
      # nothing at all.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        # One Cosign release for both jobs' signatures, the version the Docker
        # Hub signing was measured with. Dependabot moves it in the cosign stage
        # of .github/tool-versions/Dockerfile, and scripts/tool-versions.test.mjs
        # holds every cosign-release input to that stage.
        with:
          cosign-release: v3.1.4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image is pushed, signed, verified and attested as a unit before the
      # next one is built, so a failure in the variant's build cannot leave the
      # default image published -- under `latest`, which this push moves on the
      # newest release line -- and unsigned, which is the state
      # docs/RELEASES.md's verification commands report as a release that cannot
      # be trusted. `npm run check:release-signing` is what holds that ordering.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keyless: no key is passed, so Fulcio issues the signing certificate
      # against this job's OIDC identity and the signature is recorded in
      # Rekor's public transparency log. What a partner pins is therefore this
      # workflow's identity, which is this file's path plus the pushed tag ref
      # -- renaming this file or widening the tag filter above invalidates the
      # verification commands docs/RELEASES.md publishes.
      #
      # Both published manifests are signed under that one identity, in their
      # own steps below, so the verification command an operator runs differs
      # only in the reference. Each is signed by digest rather than by tag, so
      # what carries the signature is the manifest this run built rather than
      # whatever the tag resolves to later.
      - name: Sign the image
        run: |
          set -euo pipefail
          cosign sign --yes \
            ghcr.io/georgetown-mdi/alcove@${{ steps.build.outputs.digest }}

      # The command docs/RELEASES.md publishes, run against the digest just
      # signed: a signature that command cannot verify fails the release here
      # instead of reaching a partner as an image whose published check calls it
      # untrusted. Both `--certificate-` arguments are the literals that document
      # carries, held to it -- and to this workflow's own path and tag trigger,
      # which are what the identity is made of -- by
      # `npm run check:release-signing`.
      - name: Verify the signature just produced
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/georgetown-mdi/alcove/\.github/workflows/release\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ghcr.io/georgetown-mdi/alcove@${{ steps.build.outputs.digest }}

      # Answers a different question from the signature above -- what the build
      # consumed, not that this manifest is what the release published -- and is
      # held somewhere else, so it adds to the Cosign signature rather than
      # replacing it. Each subject is the same manifest-list digest cosign signs,
      # and the default image's is the one the launchers job stamps, so one
      # manifest carries both claims.
      # The attestation is left in this repository's store rather than
      # pushed to the registry as an OCI referrer (push-to-registry defaults to
      # false), so verifying it does not depend on what the registry can hold;
      # docs/RELEASES.md carries the matching verification command.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/georgetown-mdi/alcove
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Build and push the FIPS variant
        id: build_fips
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.fips
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.fips_meta.outputs.tags }}
          # The same source, revision and version labels: both images are built
          # from this checkout at this tag, so what the metadata step derived for
          # one describes the other.
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the FIPS variant image
        run: |
          set -euo pipefail
          cosign sign --yes \
            ghcr.io/georgetown-mdi/alcove@${{ steps.build_fips.outputs.digest }}

      - name: Verify the FIPS variant's signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/georgetown-mdi/alcove/\.github/workflows/release\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ghcr.io/georgetown-mdi/alcove@${{ steps.build_fips.outputs.digest }}

      - name: Attest the FIPS variant's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/georgetown-mdi/alcove
          subject-digest: ${{ steps.build_fips.outputs.digest }}

  # The host-side launchers are handed to an operator as plaintext and pin the
  # image by digest rather than by tag, so a release copy runs exactly the
  # manifest signed above. Filling that digest in is this job's whole purpose;
  # everything it publishes is a file from this checkout with one line rewritten.
  launchers:
    name: Publish the stamped launchers
    needs: [publish, release-line]
    if: ${{ github.event_name == 'push' }}
    # Held on Ubuntu 24.04 with the publish job: it needs that job's image
    # digest, so it moves when that job does.
    runs-on: ubuntu-24.04
    # One of the two jobs in this workflow holding contents: write, with
    # hosted-manifest-publish, and what each writes under it is release assets
    # alone.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp the launchers with the signed digest
        env:
          ALCOVE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "${ALCOVE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the publish job's digest output is empty or not sha256: followed by 64 lowercase hex characters" >&2
            exit 1
          fi
          ALCOVE_PLACEHOLDER='@@ALCOVE_IMAGE_DIGEST@@'
          mkdir -p launcher-assets

          # A whole-line replacement, guarded on both sides. A launcher that no
          # longer carries the expected line exactly once fails the release here
          # rather than shipping a copy with nothing stamped into it, which the
          # launcher itself would then refuse to run.
          stamp() {
            source_file="$1"
            placeholder_line="$2"
            stamped_line="$3"
            found=$(grep -c -F -x -- "$placeholder_line" "$source_file" || true)
            if [ "$found" != "1" ]; then
              echo "::error::$source_file carries the digest placeholder line $found times, not once" >&2
              exit 1
            fi
            awk -v placeholder="$placeholder_line" -v stamped="$stamped_line" \
              '$0 == placeholder { print stamped; next } { print }' \
              "$source_file" >"launcher-assets/$(basename "$source_file")"
          }

          stamp support/windows-network-filedrop/start-alcove.sh \
            "ALCOVE_IMAGE_DIGEST='@@ALCOVE_IMAGE_DIGEST@@'" \
            "ALCOVE_IMAGE_DIGEST='${ALCOVE_DIGEST}'"
          stamp support/windows-network-filedrop/Start-Alcove.ps1 \
            "\$AlcoveImageDigest = '@@ALCOVE_IMAGE_DIGEST@@'" \
            "\$AlcoveImageDigest = '${ALCOVE_DIGEST}'"

          # Start-Alcove.ps1 dot-sources this one for its path resolution, so
          # the three travel as a unit. It carries no stamp of its own.
          cp support/windows-network-filedrop/Setup-AlcoveFileDrop.ps1 launcher-assets/

          if grep -R -l -F -- "${ALCOVE_PLACEHOLDER}" launcher-assets; then
            echo "::error::a stamped launcher still carries the placeholder" >&2
            exit 1
          fi
          grep -F -- "${ALCOVE_DIGEST}" launcher-assets/start-alcove.sh >/dev/null
          grep -F -- "${ALCOVE_DIGEST}" launcher-assets/Start-Alcove.ps1 >/dev/null

      # A draft rather than a published release: the maintainer's own checklist
      # step still writes the notes and attaches the SBOM (docs/RELEASES.md).
      # A tag on an older release line is created with --latest=false, and a
      # prerelease with --prerelease as well.
      - name: Attach the launchers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ALCOVE_TAG: ${{ github.ref_name }}
          ALCOVE_NEWEST_LINE: ${{ needs.release-line.outputs.newest }}
          ALCOVE_PRERELEASE: ${{ needs.release-line.outputs.prerelease }}
        run: |
          set -euo pipefail
          create_flags=(--draft --verify-tag)
          if [ "${ALCOVE_NEWEST_LINE}" != "true" ]; then
            create_flags+=(--latest=false)
          fi
          if [ "${ALCOVE_PRERELEASE}" != "false" ]; then
            create_flags+=(--prerelease)
          fi
          if ! gh release view "$ALCOVE_TAG" >/dev/null 2>&1; then
            gh release create "$ALCOVE_TAG" "${create_flags[@]}" \
              --title "Alcove $ALCOVE_TAG" --notes ''
          fi
          gh release upload "$ALCOVE_TAG" launcher-assets/* --clobber

  # Docker Hub serves the same two images, signed, so a pull from either
  # registry is verified where it is pulled. Each is copied from the manifest
  # ghcr.io received, by the digest the publish job signed and attested, never
  # rebuilt, and is then signed in place on Docker Hub under the same release
  # identity. A job of its own, so a failed copy or signature is re-run without
  # rebuilding or moving the ghcr.io tags.
  dockerhub:
    name: Copy and sign both images on Docker Hub
    needs: [publish, release-line]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    # The publish credentials live in the Release environment, which only a
    # v*.*.* tag can use.
    environment: Release
    # Read access to the ghcr.io package: the copy writes to Docker Hub under
    # that registry's own token, and nothing here writes to GitHub. The OIDC
    # token is what the in-place keyless signature is made against, the same
    # workflow identity the publish job signs under.
    permissions:
      packages: read
      id-token: write
    env:
      GHCR_REPOSITORY: ghcr.io/georgetown-mdi/alcove
      DOCKERHUB_REPOSITORY: docker.io/gumdi/alcove
    steps:
      # Ahead of the first write to Docker Hub, for the reason the publish job
      # installs it ahead of its first push.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The publishing token, scoped to write. The DOCKERHUB_TOKEN the other
      # jobs pull with is read-only and is not used here.
      - name: Log in to Docker Hub to publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_PUBLISH_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUBLISH_TOKEN }}

      # Each image's version tag on ghcr.io and each of its tags on Docker Hub
      # are read back after the copy, and any that names a digest other than
      # the one the publish job signed fails the release. The floating `latest`
      # tags are copied on the newest release line only, and the `X.Y` tags for
      # a release only, never a prerelease, as on ghcr.io.
      - name: Copy both images by digest and compare the digests read back
        env:
          ALCOVE_TAG: ${{ github.ref_name }}
          ALCOVE_NEWEST_LINE: ${{ needs.release-line.outputs.newest }}
          ALCOVE_PRERELEASE: ${{ needs.release-line.outputs.prerelease }}
          DEFAULT_DIGEST: ${{ needs.publish.outputs.digest }}
          FIPS_DIGEST: ${{ needs.publish.outputs.fips_digest }}
        run: |
          set -euo pipefail
          version="${ALCOVE_TAG#v}"
          {
            echo "## Docker Hub copy"
            echo
            echo "| Reference | Digest |"
            echo "| --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"

          copy_and_compare() {
            digest="$1"
            suffix="$2"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::the publish job's digest output for the ${version}${suffix} image is empty or not sha256: followed by 64 lowercase hex characters" >&2
              exit 1
            fi
            tags=("${version}${suffix}")
            if [ "${ALCOVE_PRERELEASE}" = "false" ]; then
              tags+=("${version%.*}${suffix}")
            fi
            if [ "${ALCOVE_NEWEST_LINE}" = "true" ]; then
              tags+=("latest${suffix}")
            fi
            tag_args=()
            references=("${GHCR_REPOSITORY}:${tags[0]}")
            for tag in "${tags[@]}"; do
              tag_args+=(--tag "${DOCKERHUB_REPOSITORY}:${tag}")
              references+=("${DOCKERHUB_REPOSITORY}:${tag}")
            done

            docker buildx imagetools create "${tag_args[@]}" \
              "${GHCR_REPOSITORY}@${digest}"

            for reference in "${references[@]}"; do
              read_back=$(docker buildx imagetools inspect "${reference}" \
                --format '{{json .Manifest}}' | jq -r '.digest')
              if [ "${read_back}" != "${digest}" ]; then
                echo "::error::${reference} names ${read_back}, not ${digest}, the digest the publish job signed. Do not publish the release until the two agree: see docs/RELEASES.md, step 8." >&2
                exit 1
              fi
              echo "| \`${reference}\` | \`${read_back}\` |" >>"$GITHUB_STEP_SUMMARY"
            done
          }

          copy_and_compare "${DEFAULT_DIGEST}" ""
          copy_and_compare "${FIPS_DIGEST}" "-fips"

      # Signed here rather than copied: cosign 3 stores a signature as an OCI
      # referrer of the manifest, which the image copy above does not carry
      # (docs/notes/cosign-keyless-signing.md). Until this step finishes a
      # Docker Hub tag names a manifest with no signature there, so verification
      # fails closed, a failure here fails the job, and a re-run signs.
      - name: Sign both images on Docker Hub
        env:
          DEFAULT_DIGEST: ${{ needs.publish.outputs.digest }}
          FIPS_DIGEST: ${{ needs.publish.outputs.fips_digest }}
        run: |
          set -euo pipefail
          for digest in "${DEFAULT_DIGEST}" "${FIPS_DIGEST}"; do
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::a publish job digest output is empty or not sha256: followed by 64 lowercase hex characters" >&2
              exit 1
            fi
            cosign sign --yes "${DOCKERHUB_REPOSITORY}@${digest}"
          done

      # The command docs/RELEASES.md publishes, run against each Docker Hub
      # reference: a signature that command cannot verify there fails the
      # release before it is published. The `--certificate-` arguments are the
      # published literals, held to that document by
      # `npm run check:release-signing`.
      - name: Verify both signatures on Docker Hub
        env:
          DEFAULT_DIGEST: ${{ needs.publish.outputs.digest }}
          FIPS_DIGEST: ${{ needs.publish.outputs.fips_digest }}
        run: |
          set -euo pipefail
          for digest in "${DEFAULT_DIGEST}" "${FIPS_DIGEST}"; do
            cosign verify \
              --certificate-identity-regexp '^https://github\.com/georgetown-mdi/alcove/\.github/workflows/release\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${DOCKERHUB_REPOSITORY}@${digest}"
          done

  # The hosted app's build and its suites, the same gate a push to staging
  # deploys through (pages_deploy.yaml). Built from the tag, the site names the
  # tag's version (apps/web/hosted/buildIdentity.ts). This is the release's one
  # build of each site: the manifest below hashes these artifacts and the pages
  # job uploads them. A dry run runs it too, so it proves the build and the
  # manifest without deploying.
  web:
    name: Build and test the hosted app
    permissions:
      contents: read
    uses: ./.github/workflows/web_build_and_test.yaml

  # Writes the manifest of both sites from the artifacts the pages job deploys,
  # never from a build of its own, and checks each downloaded tree against it.
  # A dry run stops here, with the unsigned manifest kept as a run artifact.
  hosted-manifest:
    name: Write the hosted app's manifest
    needs: web
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      file: ${{ steps.write.outputs.file }}
      sha256: ${{ steps.write.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script is dependency-free, so a plain pinned Node suffices.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # By id and checked against the package job's digest, as in
      # pages_deploy.yaml.
      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web.outputs.artifactId }}
          path: ${{ runner.temp }}/site
      - name: Check the site against the package job's digest
        env:
          TREE: ${{ runner.temp }}/site
          EXPECTED_SHA256: ${{ needs.web.outputs.artifactSha256 }}
        run: |
          set -euo pipefail
          if ! [[ "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the package job reported no SHA-256 digest for ${TREE}" >&2
            exit 1
          fi
          digest="$(cd "${TREE}" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum -- | sha256sum)"
          if [ "${digest%% *}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::${TREE} does not match the digest the package job reported" >&2
            exit 1
          fi
      - name: Download the demo site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web.outputs.demoArtifactId }}
          path: ${{ runner.temp }}/demo-site
      - name: Check the demo site against the package job's digest
        env:
          TREE: ${{ runner.temp }}/demo-site
          EXPECTED_SHA256: ${{ needs.web.outputs.demoArtifactSha256 }}
        run: |
          set -euo pipefail
          if ! [[ "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the package job reported no SHA-256 digest for ${TREE}" >&2
            exit 1
          fi
          digest="$(cd "${TREE}" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum -- | sha256sum)"
          if [ "${digest%% *}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::${TREE} does not match the digest the package job reported" >&2
            exit 1
          fi
      # On a tag the version is the tag's. A dry run has no tag, so it names
      # the version apps/cli/package.json holds, the one the publish job's
      # version check requires the next tag to name.
      - name: Write the manifest and check both sites against it
        id: write
        env:
          ALCOVE_REF_TYPE: ${{ github.ref_type }}
          ALCOVE_REF_NAME: ${{ github.ref_name }}
          SITE_DIR: ${{ runner.temp }}/site
          DEMO_DIR: ${{ runner.temp }}/demo-site
        run: |
          set -euo pipefail
          if [ "${ALCOVE_REF_TYPE}" = "tag" ]; then
            version="${ALCOVE_REF_NAME#v}"
          else
            version="$(node -p "require('./apps/cli/package.json').version")"
          fi
          file="alcove-hosted-web-${version}.manifest.json"
          manifest="${RUNNER_TEMP}/${file}"
          node scripts/hosted-site-manifest.mjs write \
            --version "${version}" --commit "${GITHUB_SHA}" --out "${manifest}" \
            "site=${SITE_DIR}" "demo=${DEMO_DIR}"
          node scripts/hosted-site-manifest.mjs check-tree "${manifest}" "site=${SITE_DIR}"
          node scripts/hosted-site-manifest.mjs check-tree "${manifest}" "demo=${DEMO_DIR}"
          digest="$(sha256sum "${manifest}")"
          {
            echo "file=${file}"
            echo "sha256=${digest%% *}"
          } >>"$GITHUB_OUTPUT"
      - name: Upload the unsigned manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-manifest-unsigned
          path: ${{ runner.temp }}/${{ steps.write.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  # Runs no repository code: it signs, verifies and attests the file the job
  # above wrote, once it matches the digest that job reported, and only after
  # the publish job accepts the release. Signed keylessly
  # under the identity the images are, so one published --certificate- pair
  # verifies both.
  hosted-manifest-sign:
    name: Sign and attest the hosted app's manifest
    needs: [hosted-manifest, publish]
    if: ${{ github.event_name == 'push' }}
    # Held on Ubuntu 24.04 with the publish job, whose cosign and attest steps
    # this repeats.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ALCOVE_MANIFEST: ${{ needs.hosted-manifest.outputs.file }}
      ALCOVE_MANIFEST_SHA256: ${{ needs.hosted-manifest.outputs.sha256 }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Fetch the unsigned manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosted-manifest-unsigned

      - name: Check the manifest is the one the job above wrote
        run: |
          set -euo pipefail
          if [ -z "${ALCOVE_MANIFEST}" ] || [ -z "${ALCOVE_MANIFEST_SHA256}" ]; then
            echo "::error::the manifest job reported no file name or digest" >&2
            exit 1
          fi
          digest="$(sha256sum "${ALCOVE_MANIFEST}")"
          if [ "${digest%% *}" != "${ALCOVE_MANIFEST_SHA256}" ]; then
            echo "::error::${ALCOVE_MANIFEST} does not match the digest the manifest job reported" >&2
            exit 1
          fi

      - name: Sign the manifest
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${ALCOVE_MANIFEST}.sigstore.json" "${ALCOVE_MANIFEST}"

      # The command docs/RELEASES.md publishes for the manifest, with the
      # images' --certificate- pair.
      - name: Verify the signature just produced
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "${ALCOVE_MANIFEST}.sigstore.json" \
            --certificate-identity-regexp '^https://github\.com/georgetown-mdi/alcove/\.github/workflows/release\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${ALCOVE_MANIFEST}"

      - name: Attest the manifest's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ALCOVE_MANIFEST }}

      - name: Upload the signed manifest and its bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-manifest-signed
          path: |
            ${{ env.ALCOVE_MANIFEST }}
            ${{ env.ALCOVE_MANIFEST }}.sigstore.json
          if-no-files-found: error
          retention-days: 1

  # After the launchers job rather than beside it, so the two never race to
  # create the draft release. Runs no repository code.
  hosted-manifest-publish:
    name: Attach the hosted app's manifest to the release
    needs: [launchers, hosted-manifest-sign]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the signed manifest and its bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosted-manifest-signed
          path: hosted-manifest

      - name: Attach the manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALCOVE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$ALCOVE_TAG" hosted-manifest/* --clobber

  # The production deployment of the hosted app and the demo site. It needs the
  # publish job, so a tag that job refuses -- a version that disagrees with
  # apps/cli/package.json, a failed test, scan or signature -- deploys nothing,
  # and the image a deployed site's commands name is already published. It
  # needs the manifest's signature too, so production never serves a release
  # build that has no signed manifest. A tag on an older release line, such as
  # a hotfix of the previous major, skips it, so production keeps the newest
  # release's build. A prerelease runs it, so production serves the build that
  # names the prerelease's own image once main is promoted to it. A tag main
  # has moved past uploads nothing either (the comparison step before the
  # upload), so production keeps the newer build main deployed.
  #
  # The only job here given the Cloudflare credentials. As in
  # pages_deploy.yaml, it checks out the deploy tool's lockfile alone and runs
  # no other repository code: it installs wrangler from that lockfile,
  # downloads the sites the gate built and tested by id, checks each against
  # the digest the package job reported, and uploads them.
  pages:
    name: Deploy the hosted app to Cloudflare Pages
    needs:
      - web
      - publish
      - hosted-manifest-sign
      - hosted-manifest-publish
      - release-line
    if: ${{ github.event_name == 'push' && (needs.release-line.outputs.newest == 'true' || needs.release-line.outputs.prerelease == 'true') }}
    # Held on Ubuntu 24.04 with pages_deploy.yaml's upload job.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    # The checkout of the deploy tool's lockfile, and the comparison with main.
    permissions:
      contents: read
    outputs:
      uploaded: ${{ steps.compare-main.outputs.upload }}
      siteUrl: ${{ steps.deploy.outputs.deployment-url }}
      demoUrl: ${{ steps.deploy-demo.outputs.deployment-url }}
      demoOutcome: ${{ steps.deploy-demo.outcome }}
    steps:
      - name: Check out the deploy tool's lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/wrangler/package.json
            /.github/wrangler/package-lock.json
      - name: Install the deploy tool from its lockfile
        working-directory: .github/wrangler
        run: npm ci --no-audit --no-fund
      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web.outputs.artifactId }}
          path: ${{ runner.temp }}/site
      - name: Check the site against the package job's digest
        env:
          TREE: ${{ runner.temp }}/site
          EXPECTED_SHA256: ${{ needs.web.outputs.artifactSha256 }}
        run: |
          set -euo pipefail
          if ! [[ "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the package job reported no SHA-256 digest for ${TREE}" >&2
            exit 1
          fi
          digest="$(cd "${TREE}" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum -- | sha256sum)"
          if [ "${digest%% *}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::${TREE} does not match the digest the package job reported" >&2
            exit 1
          fi
      # Uploads only while main's tip is the release commit or an ancestor of
      # it; otherwise pages_deploy.yaml may already serve a newer commit, and
      # production keeps it. A failed call fails the job, uploading nothing.
      - name: Compare the release commit with main
        id: compare-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq .status)"
          case "${status}" in
            identical | behind)
              echo "upload=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "upload=false" >>"$GITHUB_OUTPUT"
              echo "::notice::Skipped the production upload: main holds a commit the release commit lacks (compare status ${status}), so production keeps main's last build."
              echo "Skipped the production upload: \`main\` holds a commit the release commit ${GITHUB_SHA} lacks (compare status \`${status}\`), so production keeps \`main\`'s last build." >>"$GITHUB_STEP_SUMMARY"
              ;;
          esac
      # As in pages_deploy.yaml: wrangler gets the command as arguments with no
      # shell. The branch is the Pages projects' production branch
      # (infra/hosted/cloudflare.tf), which makes the upload the production
      # deployment; the tag name would make it a preview.
      - name: Deploy
        id: deploy
        if: steps.compare-main.outputs.upload == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          workingDirectory: .github/wrangler
          command: pages deploy ${{ runner.temp }}/site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
      # As in pages_deploy.yaml: after the site, and skipped while the
      # environment sets no CLOUDFLARE_DEMO_PAGES_PROJECT.
      - name: Download the demo site
        if: steps.compare-main.outputs.upload == 'true' && vars.CLOUDFLARE_DEMO_PAGES_PROJECT != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web.outputs.demoArtifactId }}
          path: ${{ runner.temp }}/demo-site
      - name: Check the demo site against the package job's digest
        if: steps.compare-main.outputs.upload == 'true' && vars.CLOUDFLARE_DEMO_PAGES_PROJECT != ''
        env:
          TREE: ${{ runner.temp }}/demo-site
          EXPECTED_SHA256: ${{ needs.web.outputs.demoArtifactSha256 }}
        run: |
          set -euo pipefail
          if ! [[ "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the package job reported no SHA-256 digest for ${TREE}" >&2
            exit 1
          fi
          digest="$(cd "${TREE}" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum -- | sha256sum)"
          if [ "${digest%% *}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::${TREE} does not match the digest the package job reported" >&2
            exit 1
          fi
      - name: Deploy the demo site
        id: deploy-demo
        if: steps.compare-main.outputs.upload == 'true' && vars.CLOUDFLARE_DEMO_PAGES_PROJECT != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          workingDirectory: .github/wrangler
          command: pages deploy ${{ runner.temp }}/demo-site --project-name=${{ vars.CLOUDFLARE_DEMO_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

  # As in pages_deploy.yaml: a job of its own, holding no credentials, since it
  # runs repository code. It runs only once the pages job has uploaded.
  check-security-txt:
    name: Check the served security.txt
    needs: pages
    if: ${{ needs.pages.outputs.uploaded == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Check the site
        env:
          DEPLOYMENT_URL: ${{ needs.pages.outputs.siteUrl }}
        run: node scripts/check-served-security-txt.mjs
      - name: Check the demo site
        if: ${{ !cancelled() && needs.pages.outputs.demoOutcome == 'success' }}
        env:
          DEPLOYMENT_URL: ${{ needs.pages.outputs.demoUrl }}
        run: node scripts/check-served-security-txt.mjs

  # A dispatch can come from any branch, so this job holds no write permission
  # by design.
  dry-run:
    name: Build both images without publishing
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      # A step's `if:` is not given the secrets context, so whether the Docker
      # Hub token is set reaches the login step below through this.
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify vendored native tarball integrity
        run: sha256sum -c lib/openmined-psi.js-*.tgz.sha256

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Verify vendored native tarball provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:prebuild-provenance

      # The publish job's pull login, for the same images. It publishes
      # nothing: the token reads public images only.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_LOGIN == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The publish job's emulator pin; move the two together.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      # The BuildKit image, pinned by digest where the
      # action's default floats on `buildx-stable-1`. Dependabot moves the pin
      # in .github/builder-images/Dockerfile, and scripts/dockerhub-login.test.mjs
      # fails until all four setup-buildx-action steps, in this workflow and in
      # image_smoke.yaml, pass it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Build the release image for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: alcove:dry-run
          cache-from: type=gha,scope=dry-run
          cache-to: type=gha,mode=max,scope=dry-run

      - name: Build the FIPS variant for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.fips
          platforms: linux/amd64,linux/arm64
          push: false
          tags: alcove:dry-run-fips
          cache-from: type=gha,scope=dry-run-fips
          cache-to: type=gha,mode=max,scope=dry-run-fips
