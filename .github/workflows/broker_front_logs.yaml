name: Broker Front Logs

# Drives each kind of failed request through the broker's TLS front, rendered
# from infra/broker/nginx.conf.tmpl in the image infra/broker/Dockerfile pins,
# and fails if any log line contains a request's query string, a request
# writes an error-log line, or the access log does not tell the failure kinds
# apart
# (scripts/check-broker-front-logs.mjs). It needs Docker, which the dev
# container lacks.
#
# Runs on a pull request that can change the answer, a dependabot bump of the
# image included. Not a merge gate: one request waits out the template's 300 s
# proxy_read_timeout.
on:
  pull_request:
    paths:
      - "infra/broker/nginx.conf.tmpl"
      - "infra/broker/Dockerfile"
      - "infra/broker/render-config.sh"
      - "scripts/check-broker-front-logs.mjs"
      - ".github/workflows/broker_front_logs.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check the TLS front's logs
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # A step's `if:` is not given the secrets context, so whether the Docker
      # Hub token is set reaches the login step below through this.
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      # The script is dependency-free, so a plain pinned Node suffices.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # The nginx image comes from Docker Hub, which limits anonymous pulls per
      # source IP, and hosted runners share theirs.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_LOGIN == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check
        run: node scripts/check-broker-front-logs.mjs
