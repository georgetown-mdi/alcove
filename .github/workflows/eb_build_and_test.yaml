name: Build and Test for Elastic Beanstalk

# Yoinked from here:
# https://blog.danskingdom.com/Multiple-ways-to-setup-your-CI-CD-pipelines-in-GitHub-Actions/#approach-5-deploy-workflow-includes-build-workflow-and-uses-template-for-deployments-include-approach-with-reusable-workflows

# The terminal `Web Build and Test` job is a required status check on main and
# staging, so the pull_request trigger carries no `paths:` filter: a filtered
# required check leaves an unrelated pull request waiting on it forever. The
# `scope` job decides from the changed files whether the real jobs run, and on
# a pull request touching none of the web app's inputs the terminal job passes
# without them. The merge-gate identities check, run by static_checks.yaml,
# fails this file carrying a path filter under on.pull_request.
on:
  # Pull-request validation. Deploys build through eb_deploy.yaml's
  # workflow_call, so there is no standalone push trigger here -- it would
  # double-run with the pull_request event on a feature branch that already has
  # an open PR.
  pull_request:
    branches: [main, staging]

  workflow_call:
    outputs:
      artifactName:
        description: "Name of the uploaded artifact"
        value: ${{jobs.package.outputs.artifactName}}

# Cancel a superseded PR run when a newer commit lands on the same PR/branch.
# NOT keyed on github.workflow: in a workflow_call invocation the github context
# is the caller's, so github.workflow resolves to eb_deploy.yaml's name and this
# block would share eb_deploy.yaml's concurrency group, self-cancelling the
# deploy on a single push (a GitHub Actions reusable-workflow hazard). A literal
# prefix keeps this group independent of any caller. The || github.run_id
# fallback gives the deploy leg's reused build a unique group (head_ref is empty
# off pull_request), so cancel-in-progress is inert there and never cancels a
# deploy; on a PR, head_ref groups the PR's runs so a newer commit supersedes.
concurrency:
  group: eb-build-and-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Least privilege: this build/test gate only needs to read the repo.
permissions:
  contents: read

env:
  ARTIFACT_NAME: ${{format('{0}-{1}', vars.EB_APPLICATION_NAME, github.sha)}}

jobs:
  scope:
    name: Decide whether the web suites run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Off a pull request (the deploy's workflow_call) there is no diff to take,
    # so both steps skip and `run` defaults to true without a checkout.
    outputs:
      run: ${{ steps.scope.outputs.run || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # Full history so the diff can reach the pull request's merge base.
          fetch-depth: 0
      # This scope diverges from the push filter in eb_deploy.yaml on test
      # sources: it uses the broad apps/web/** and packages/core/** globs so a
      # test-only PR (deleting or weakening assertions, or changing vitest
      # config) still runs the full suite, including the core tests on the
      # `core` leg, while the deploy filter omits the test/** trees. The two
      # lists cannot be one because of that difference.
      #
      # packages/peerjs-broker/** is here because the web app bundles the
      # signaling broker from that workspace into the deployed server, and
      # packages/testkit/** because the web unit suite is driven by fixtures it
      # holds. eb_deploy.yaml is here because the deploy-trigger coverage step
      # reads its push filter, and narrowing that filter is the change the step
      # exists to catch.
      #
      # The `!` entries exclude markdown under the directory globs. The claim
      # that no suite this gate runs reads one as a fixture or input is held by
      # scripts/check-deploy-trigger-graph.test.mjs, not by this comment.
      - id: scope
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/path-scope
        with:
          paths: |
            lib/**
            package-lock.json
            tsconfig.base.json
            apps/web/**
            packages/core/**
            packages/peerjs-broker/**
            packages/testkit/**
            .github/actions/setup/**
            .github/actions/path-scope/**
            .github/workflows/eb_build_and_test.yaml
            .github/workflows/eb_deploy.yaml
            !lib/**/*.md
            !apps/web/**/*.md
            !packages/core/**/*.md
            !packages/peerjs-broker/**/*.md
            !packages/testkit/**/*.md
            !.github/actions/setup/**/*.md

  # The deploy artifact's producer. A job of its own rather than a leg of the
  # suite matrix below because it carries the workflow_call output eb_deploy.yaml
  # reads, and because the matrix legs run in parallel with it rather than behind
  # it.
  #
  # The upload does not wait on the suite legs, so an artifact exists for a sha
  # whose tests went red. Nothing deploys such an artifact: eb_deploy.yaml's
  # deploy job needs the caller job wrapping this whole workflow, every job of it
  # included.
  package:
    name: Package the deploy artifact
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Bound the job: eb_deploy.yaml gates its deploy on this workflow through
    # workflow_call, so a stalled install or build here holds a production deploy
    # rather than only a pull request. 15 min sits far above a normal run
    # (install + the web build + the zip) yet cuts a true hang short.
    timeout-minutes: 15
    outputs:
      artifactName: ${{steps.artifact-name.outputs.artifactName}}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      # Pins Node, installs from the lockfile, and builds @alcove/core.
      - name: Set up and build core
        uses: ./.github/actions/setup
      # The production web build this job packages below. The deploy-trigger
      # coverage check (check:deploy-trigger-graph) runs in the repo-wide
      # static checks, not here. The build refuses to run without the
      # signaling broker's address, a repository variable.
      - name: Build web app
        env:
          # A pull request build is a check, not a deploy; the push build
          # must refuse without the real address.
          VITE_SIGNALING_SERVER_URL: ${{ github.event_name == 'pull_request' && (vars.VITE_SIGNALING_SERVER_URL || 'wss://signaling.example.invalid/api/') || vars.VITE_SIGNALING_SERVER_URL }}
        run: npm run build -w apps/web
      # Renders every page route from the build the step above left in
      # apps/web/.output, the one packaged below, and fails on a 5xx or on
      # anything the server writes to stderr while rendering.
      - name: Render every web route
        run: node scripts/check-web-route-render.mjs
      - name: Package for Elastic Beanstalk
        run: |
          cp -a apps/web/deploy/aws_eb/. apps/web/.output
          touch apps/web/.output/.env
          (cd apps/web/.output && zip -r ../../../${{github.sha}}.zip .)
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: ${{github.sha}}.zip
          compression-level: 0
      - name: Output artifact name
        id: artifact-name
        run: echo "artifactName=${{env.ARTIFACT_NAME}}" >> "$GITHUB_OUTPUT"

  # The four suites this gate runs share no mutable state, so they run as
  # parallel legs of one matrix rather than as serial steps of one job, and the
  # gate's wall time is its slowest suite rather than their sum. Each leg is a
  # runner of its own, and within a leg each suite stands up everything it
  # touches: the integration and browser projects share one self-managing vitest
  # globalSetup that spawns the dev server and tears it down
  # (apps/web/test/devServer/globalSetup.ts), and the cross-runtime suite's whole
  # world is a temporary file-drop directory. Nothing crosses a leg boundary.
  #
  # The terminal `build-and-test` job below holds one stable name for a required
  # status check to name, since each leg's own check-run name carries its leg
  # values.
  suite:
    name: Test (${{ matrix.suite }})
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Bound every leg: the integration and browser leg drives a real browser and
    # a live WebRTC exchange through a spawned dev server -- workloads that can
    # wedge in ways the suite's own 60s timeouts do not all catch (a stuck
    # browser or teardown, a stalled data channel). Without this the default 6h
    # timeout applies, and since eb_deploy.yaml gates its deploy on this workflow
    # via workflow_call, a hang would also stall a production deploy. 30 min sits
    # far above a normal leg yet cuts a true hang short. It must also clear the
    # worst case the browser provisioning step below is allowed: its 22 min plus
    # the few minutes the rest of that leg measures, so an upstream stall there
    # ends on that step's own named failure rather than on this cap, which GitHub
    # reports as a cancellation.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core unit suite runs on this gate because the deployed server
          # bundles @alcove/core. test:unit is the same vitest project as
          # `npm test -w packages/core` without that script's pretest rebuild:
          # the setup action has already restored or built packages/core/dist and
          # restamped its mtimes, so the rebuild would only repeat it.
          - suite: core
            command: npm run test:unit -w packages/core
          # Web unit tests run in the node environment against the already-built
          # @alcove/core -- no dev server, browser, or Docker (the integration
          # and browser projects are the ones that stand up a server), so the
          # shared setup is all this leg needs.
          - suite: web unit
            command: npm run test:unit -w apps/web
            web-suite: "true"
          # The cross-runtime suite drives the real `alcove` program against a
          # party built from this app's own exchange modules, so it needs the CLI
          # built -- no other leg here does. It stands up no server and no
          # browser: its whole world is a temporary file-drop directory.
          #
          # It runs here AND on the CLI workflow's own leg: the drift it exists
          # to catch can land on either runtime, and each workflow's path scope
          # sees only its own.
          - suite: cross-runtime interop
            command: npm run test:interop -w apps/web
            web-suite: "true"
            build-cli: "true"
          # Integration and browser tests both stand up the web dev server
          # through the shared globalSetup described above (integration hits the
          # HTTP/SSE routes in node, browser drives Chromium). Running both
          # projects in ONE vitest process lets that setup start the server once
          # and the second project reuse it, rather than two invocations each
          # paying a full cold start -- so keep them combined via the dedicated
          # test:integration:browser script (which names both projects
          # explicitly). Splitting them into separate test:integration +
          # test:browser commands reintroduces the second cold start. vitest
          # still reports per project/file, so a failure names the suite that
          # broke.
          #
          # The integration project gates the web deploy on the app's own
          # behavior (independent of the CLI, whose tests live in release.yaml);
          # the browser project covers the security-relevant accept-screen
          # controls (the consent gate over the PII exchange and the decode-error
          # escaping) plus the live PSI exchange and cross-implementation vectors
          # -- behavior no other CI job covers, since it needs a DOM the node
          # projects lack, so a browser-only regression would otherwise ship
          # unnoticed. Both run on the PR gate and this workflow's push/deploy
          # path, so the deploy artifact is gated on them too.
          - suite: integration and browser
            command: npm run test:integration:browser -w apps/web
            web-suite: "true"
            build-web: "true"
            playwright: "true"
    steps:
      - uses: actions/checkout@v7
      # Pins Node, installs from the lockfile, and builds @alcove/core. Those
      # two are what every leg would otherwise repeat; the action restores both
      # from content-keyed caches, so they are paid once per lockfile and
      # core-source state across the whole repository rather than once per leg.
      - uses: ./.github/actions/setup
      # The web suites skip the legs whose environment prerequisites are absent
      # (a loopback TLS certificate, which needs `openssl`), and
      # apps/web/test/requireTestPrerequisites.ts turns such a skip into a
      # failure only where CI marks an environment provisioned to a spec. That
      # guard is registered at the root test block of apps/web/vite.config.ts, so
      # it gates every project this workflow's web legs run. GitHub Actions sets
      # CI on every job, so the gate is armed here -- asserted rather than
      # assumed, because if that ever stopped holding the gate would go quiet
      # with nothing failing. The expression is the guard's own predicate: set,
      # and not the string "false".
      - name: Assert the test-prerequisite gate is armed
        if: matrix.web-suite == 'true'
        run: test "${CI:-false}" != "false"
      - name: Build the CLI for the cross-runtime suite
        if: matrix.build-cli == 'true'
        run: npm run build -w apps/cli
      # The integration project's globalSetup
      # (apps/web/test/integration/requireProdBuild.ts) fails the run when
      # apps/web/.output or the console builds under apps/web/dist are absent
      # rather than letting the suites that drive the built servers skip, so
      # this leg builds the hosted app and the console for itself. Taking the
      # `package` job's build through the deploy artifact instead would serialize
      # the slowest leg behind that job for a build of about half a minute.
      # The suites serve the build over http and need no reachable broker, so
      # it names a loopback ws: address.
      - name: Build the web app for the integration suites
        if: matrix.build-web == 'true'
        run: |
          VITE_SIGNALING_SERVER_URL=ws://127.0.0.1/api/ npm run build -w apps/web
          npm run build:console -w apps/web
          npm run build:console-server -w apps/web
      # apt applies no network timeout of its own, so a mirror connection that
      # goes quiet hangs the --with-deps install below with nothing to time it
      # out.
      - name: Bound apt network stalls
        if: matrix.playwright == 'true'
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
      # The browser build a playwright release drives is keyed to that release, so
      # the cache below is keyed on the version `npm ci` actually installed rather
      # than the range apps/web declares. Resolved from apps/web, which owns the
      # dependency, so a layout that stops hoisting playwright to the repository
      # root still finds it.
      - name: Resolve the installed Playwright version
        if: matrix.playwright == 'true'
        id: playwright
        working-directory: apps/web
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A hit restores the browser build into the directory the install step below
      # reads, taking the download CDN out of the run entirely; the apt libraries
      # --with-deps installs are not in this cache and are installed on every run
      # regardless. No restore-keys: a build saved under another playwright version
      # is not the one this version drives, and restoring it would only carry it
      # into the next save. Restoring and saving are separate steps so the save
      # sits after the install below rather than in a post-job step: a browser
      # directory left partial by a provisioning run that failed every attempt is
      # then never archived under this key, whose entry no later run of the same
      # playwright version could replace.
      - name: Restore the Playwright browser build
        if: matrix.playwright == 'true'
        id: browser-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{runner.os}}-${{runner.arch}}-${{steps.playwright.outputs.version}}
      # A hit that restores nothing falls through to a silent re-download -- the
      # cost this cache exists to remove -- so fail on the empty restore instead of
      # paying it unremarked.
      - name: Verify the restored browser build
        if: matrix.playwright == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
        run: test -n "$(ls -A ~/.cache/ms-playwright)"
      # The browser project drives real Chromium; the stock ubuntu-latest runner
      # ships none, so provision it and the apt libraries it links against here,
      # before that project runs. --with-deps installs those apt libraries;
      # on Node 26 this needs playwright >= 1.60 (earlier versions hang extracting
      # the browser archive, microsoft/playwright#40724) -- the lockfile pins
      # >= 1.61, so do not downgrade. (The dev container provisions Chromium
      # separately and is maintained independently.)
      #
      # An upstream that trickles rather than falls silent -- the apt mirror the
      # timeouts above cannot catch, or the browser CDN -- stalls this command
      # instead of failing it, and a plain rerun has been enough to clear it, so
      # each attempt bounds the whole command and a stalled attempt is retried here
      # rather than costing a human rerun of the workflow. The 10m per-attempt
      # bound clears the slowest measured success (7m24s) with headroom; two
      # attempts, each with timeout's 30s kill-after grace, plus the 15s backoff
      # between them total 21m15s, inside timeout-minutes, so the per-attempt
      # bound is what fires and names the failure, and timeout-minutes fits
      # inside the job bound above.
      - name: Install Playwright Chromium
        if: matrix.playwright == 'true'
        timeout-minutes: 22
        run: |
          attempts=2
          attempt_timeout=10m
          for attempt in $(seq 1 "$attempts"); do
            status=0
            timeout --kill-after=30s "$attempt_timeout" npx playwright install --with-deps chromium || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 124 ]; then
              outcome="hit the $attempt_timeout bound"
            else
              outcome="failed with exit status $status"
            fi
            echo "::warning::Playwright provisioning attempt $attempt $outcome"
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 15
            fi
          done
          echo "::error::Playwright provisioning failed on all $attempts attempts; the last one $outcome"
          exit "$status"
      - name: Save the Playwright browser build
        if: matrix.playwright == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{runner.os}}-${{runner.arch}}-${{steps.playwright.outputs.version}}
      - name: Run the ${{ matrix.suite }} suite
        run: ${{ matrix.command }}

  # The one job name a required status check can name, standing for the package
  # job and every suite leg above. `if: always()` is what makes it usable as one:
  # without it a failed job leaves this one skipped, and a skipped required check
  # stays pending rather than red, so the pull request would be unmergeable with
  # nothing red to show for it. The name is unique across the workflow tree, so
  # the required context matches this job alone; eb_deploy.yaml's caller job
  # shares the bare id.
  build-and-test:
    name: Web Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope, package, suite]
    if: always()
    steps:
      - name: Report the job results
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          PACKAGE: ${{ needs.package.result }}
          SUITE: ${{ needs.suite.result }}
        run: |
          echo "scope: $SCOPE (run=$RUN)"
          test "$SCOPE" = success
          if [ "$RUN" = false ]; then
            echo "no web-affecting change; passing without the build and suites"
            exit 0
          fi
          echo "package: $PACKAGE"
          echo "suite legs: $SUITE"
          test "$PACKAGE" = success
          test "$SUITE" = success
