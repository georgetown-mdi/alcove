# Accepted exceptions to the container image vulnerability scan that
# .github/workflows/image_smoke.yaml runs on a pull request, on its weekly
# schedule and against the published tag, and .github/workflows/release.yaml
# runs ahead of a publish.
#
# That scan fails on a vulnerability in one of the image's OS or language
# packages that is HIGH or CRITICAL and has a fix available; image_smoke.yaml's
# scan of the FIPS variant gates on every trigger, pull requests included, and
# reads this same list, so it fails its run on a non-ignored finding the same
# as the default leg. An entry here exempts one vulnerability id from every one
# of them, and is a reviewed decision rather than a way to quiet a build: write
# the reason it was accepted in `statement`, so a reader can tell an assessed
# exception from a forgotten one.
#
# Every entry carries an `expired_at`. Trivy stops applying an entry on that
# date and the finding returns, which is the only thing that would ever prompt
# the entry's removal: while it is in force the gate is green whether or not
# the condition it was written for still holds, so the weekly scheduled scan in
# image_smoke.yaml cannot report a stale acceptance on its own. Expiry turns
# that silence into a dated re-read -- either the acceptance is renewed with a
# new date, or the entry comes out.
#
# The extension is required: Trivy picks its parser from it, so this content
# under an extensionless name parses as a plain list of ids, matches nothing
# here, and suppresses nothing. Both malformed shapes fail visibly rather than
# silently widening the exemption -- a body that does not parse as this schema
# exempts nothing, and an unparseable `expired_at` aborts the scan.
#
# Scope every entry to the packages it was assessed against. An id on its own
# applies to every package of every image scanned, and the two images hold
# different OS package sets -- Alpine in the default image, Amazon Linux in the
# FIPS variant -- so an unscoped entry also suppresses the id on a package whose
# fix is published and reachable. A `purls` list holds the entry to the packages
# it names.
#
#   vulnerabilities:
#     - id: CVE-0000-00000
#       purls:
#         - pkg:apk/alpine/some-package
#       statement: "why this was accepted"
#       expired_at: 2026-01-01

vulnerabilities:
  # Accepted 2026-09-29. The base closure's systemd, rpm, curl and pcre2.
  - id: CVE-2026-16742
    purls:
      - pkg:rpm/amazon/systemd
      - pkg:rpm/amazon/systemd-libs
      - pkg:rpm/amazon/systemd-networkd
      - pkg:rpm/amazon/systemd-pam
      - pkg:rpm/amazon/systemd-resolved
    statement: >-
      systemd-homed adopts a user record its worker returns without
      verifying the record's signature, so a logged-in homed-managed user
      can add themselves to a privileged system group. This entry covers
      the FIPS variant image's Amazon Linux systemd, systemd-libs,
      systemd-networkd, systemd-pam and systemd-resolved at
      252.23-12.amzn2023, fixed at 252.23-13.amzn2023, and no other
      package. Accepted because the vulnerable path is the systemd-homed
      service, which this image does not carry and no Alcove role runs:
      the image holds no systemd-homed binary, no container the entrypoint
      starts runs systemd as its init, and neither role logs in a Unix
      account -- both are node processes under the unprivileged account
      the runtime stage drops to. These packages are in the image as part
      of the base package closure, installed by no name in
      Dockerfile.fips; what a run reaches of them is libsystemd, which
      smbclient links when Alcove's doctor command runs it, and the
      advisory names no flaw there. Cleared by moving Dockerfile.fips to
      the amazonlinux:2023 rootfs carrying 2023.12.20260928 or later, the
      first snapshot serving 252.23-13.amzn2023 or later. No published
      rootfs carries that release -- the newest, measured 2026-09-30, is
      2023.12.20260918, the release Dockerfile.fips pins -- and the build
      asserts that the rootfs release equals the dnf releasever, so a
      snapshot-only bump fails by design and there is no base to bump to.
      This entry comes out in the same diff as that bump, which "Bumping
      the FIPS base image" in docs/spec/DEPENDENCY_PINS.md describes.
    expired_at: 2026-10-15
  - id: CVE-2026-78367
    purls:
      - pkg:rpm/amazon/python3-rpm
      - pkg:rpm/amazon/rpm
      - pkg:rpm/amazon/rpm-build-libs
      - pkg:rpm/amazon/rpm-libs
      - pkg:rpm/amazon/rpm-sign-libs
    statement: >-
      rpmbuild's tarball mode expands a crafted tar member name as RPM
      macros, running code as the user who builds the tarball. This entry
      covers the FIPS variant image's Amazon Linux python3-rpm, rpm,
      rpm-build-libs, rpm-libs and rpm-sign-libs at
      4.16.1.3-29.amzn2023.0.7, fixed at 4.16.1.3-29.amzn2023.0.8, and no
      other package. Accepted because the vulnerable path is rpmbuild run
      on an attacker's source tarball, and this image holds no rpmbuild
      executable and builds no package. rpm is in this image as part of
      the base package closure, installed by no name in Dockerfile.fips,
      and its callers here are rpm and the dnf and python stack the base
      carries, which run during the build and not in a container the
      entrypoint starts. Both roles are node processes, and the only other
      executables a run reaches are the two shell entrypoints and
      smbclient. Cleared by moving Dockerfile.fips to the amazonlinux:2023
      rootfs carrying 2023.12.20260928 or later, the first snapshot serving
      4.16.1.3-29.amzn2023.0.8. No published rootfs carries that release
      -- the newest, measured 2026-09-30, is 2023.12.20260918, the release
      Dockerfile.fips pins -- and the build asserts that the rootfs
      release equals the dnf releasever, so a snapshot-only bump fails by
      design and there is no base to bump to. This entry comes out in the
      same diff as that bump, which "Bumping the FIPS base image" in
      docs/spec/DEPENDENCY_PINS.md describes.
    expired_at: 2026-10-15
