  - id: CVE-2026-80230
    purls:
      - pkg:rpm/amazon/curl-minimal
      - pkg:rpm/amazon/libcurl-minimal
    statement: >-
      libcurl does not enforce CURLOPT_PINNEDPUBLICKEY on a connection
      with no server certificate when the application has also turned off
      peer and host verification. This entry covers the FIPS variant
      image's Amazon Linux curl-minimal and libcurl-minimal at
      8.21.0-5.amzn2023.0.1, fixed at 8.21.0-5.amzn2023.0.2, and no other
      package. Accepted because reaching the vulnerable path needs a
      program that sets a pinned public key and disables verification on
      this copy of libcurl, and nothing in the image does. curl-minimal is
      in this image as part of the base package closure, installed by no
      name in Dockerfile.fips, and its callers here are the curl command
      and dnf's repository downloader, which runs during the build and not
      in a container the entrypoint starts. Both roles are node processes,
      and node comes from the official tarball and links no libcurl; the
      only other executables a run reaches are the two shell entrypoints
      and smbclient, which does not link it either. Cleared by moving
      Dockerfile.fips to the amazonlinux:2023 rootfs carrying
      2023.12.20260928 or later, the first snapshot serving
      8.21.0-5.amzn2023.0.2. No published rootfs carries that release --
      the newest, measured 2026-09-30, is 2023.12.20260918, the release
      Dockerfile.fips pins -- and the build asserts that the rootfs
      release equals the dnf releasever, so a snapshot-only bump fails by
      design and there is no base to bump to. This entry comes out in the
      same diff as that bump, which "Bumping the FIPS base image" in
      docs/spec/DEPENDENCY_PINS.md describes.
    expired_at: 2026-10-15
  - id: CVE-2026-89161
    purls:
      - pkg:rpm/amazon/pcre2
      - pkg:rpm/amazon/pcre2-syntax
    statement: >-
      pcre2_jit_match frees a subject that an earlier pcre2_match call
      copied into the same match data, an incorrect free. This entry
      covers the FIPS variant image's Amazon Linux pcre2 and pcre2-syntax
      at 10.40-1.amzn2023.0.3, fixed at 10.40-1.amzn2023.0.4, and no other
      package. Accepted because the vulnerable path is a direct call to
      pcre2_jit_match, and the only library in the image that makes one is
      glib2, whose callers here are the dnf and python stack the base
      carries, which runs during the build and not in a container the
      entrypoint starts. pcre2 is in this image as part of the base
      package closure, installed by no name in Dockerfile.fips. A run does
      reach it through libselinux, which smbclient links when Alcove's
      doctor command runs it, but libselinux calls pcre2_match and not
      pcre2_jit_match. Both roles are node processes, and node links no
      pcre2. Cleared by moving Dockerfile.fips to the amazonlinux:2023
      rootfs carrying 2023.12.20260928 or later, the first snapshot serving
      10.40-1.amzn2023.0.4. No published rootfs carries that release --
      the newest, measured 2026-09-30, is 2023.12.20260918, the release
      Dockerfile.fips pins -- and the build asserts that the rootfs
      release equals the dnf releasever, so a snapshot-only bump fails by
      design and there is no base to bump to. This entry comes out in the
      same diff as that bump, which "Bumping the FIPS base image" in
      docs/spec/DEPENDENCY_PINS.md describes.
    expired_at: 2026-10-15
  - id: CVE-2026-8924
    purls:
      - pkg:rpm/amazon/curl-minimal
      - pkg:rpm/amazon/libcurl-minimal
    statement: >-
      curl's cookie parser lets a malicious HTTP server set cookies that
      bypass the Public Suffix List check, so an attacker-controlled
      origin injects cookies curl then sends to unrelated domains. This
      entry covers the FIPS variant image's Amazon Linux curl-minimal
      and libcurl-minimal at 8.17.0-1.amzn2023.0.3, fixed at
      8.21.0-5.amzn2023.0.1, and no other package. Accepted because
      reaching the vulnerable path needs a program that fetches from an
      attacker-controlled HTTP server with this copy of libcurl and
      keeps cookies, and nothing in the image does. curl-minimal is in
      this image as part of the base package closure, installed by no
      name in Dockerfile.fips, and its callers here are the curl command
      and dnf's repository downloader, which runs during the build and
      not in a container the entrypoint starts. Both roles are node
      processes, and node comes from the official tarball and links no
      libcurl; the only other executables a run reaches are the two
      shell entrypoints and smbclient, which does not link it either.
      Cleared by moving Dockerfile.fips to the amazonlinux:2023 rootfs
      2023.12.20260918 or later, whose package snapshot serves
      8.21.0-5.amzn2023.0.1, as measured 2026-09-29 on a host outside
      this container. The build asserts that the rootfs release equals
      the dnf releasever, so a snapshot-only bump fails by design. This
      entry comes out in the same diff as that bump, which "Bumping the
      FIPS base image" in docs/spec/DEPENDENCY_PINS.md describes.
    expired_at: 2026-10-15
  - id: CVE-2026-8286
    purls:
      - pkg:rpm/amazon/curl-minimal
      - pkg:rpm/amazon/libcurl-minimal
    statement: >-
      A new transfer that upgrades with STARTTLS may reuse an existing
      live connection whose TLS configuration does not match. This entry
