version: 2
updates:
  # Workspace root and all npm packages
  - package-ecosystem: npm
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Supply-chain hardening: never adopt a freshly published release. The
    # cooldown holds a new version until the ecosystem has had time to expose a
    # compromised release (hijacked maintainer token, malicious postinstall)
    # before we ingest it, trading a few days of patch latency for not being the
    # first to pull. It delays routine version bumps only.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5
    groups:
      # Cryptographic dependencies are grouped separately so they are reviewed
      # together and subject to the security review requirement in CONTRIBUTING.md.
      cryptographic:
        patterns:
          - "@openmined/psi.js"
          - "node-forge"
          - "ssh2"
          - "ssh2-sftp-client"
          - "@microsoft/dev-tunnels-ssh"
      # The WebRTC stack is grouped (not batched into non-critical) so each
      # bump is checked against its checklist before it merges: the web
      # inbound bound drives peerjs internals, the CLI transport drives
      # werift's RTCPeerConnection and reads its SCTP send queues, and
      # peerjs-js-binarypack's wire format is decoded by both sides of an
      # exchange. The two halves speak one data channel to each other, so a
      # bump on either side is reviewed against both -- see the "Upgrading the
      # PeerJS Stack" and "Upgrading the CLI WebRTC peer" checklists in
      # docs/spec/WEBRTC_STACK.md, the same review the SFTP stack gets.
      webrtc-stack:
        patterns:
          - "peerjs"
          - "peerjs-js-binarypack"
          - "werift"
      # The @vitest/* plugins peer-pin the exact vitest version, so an
      # ungrouped major bump arrives as several separate pull requests that
      # each fail their own install and must be landed by hand. Grouped here,
      # with no update-types restriction, so a major moves the whole set in
      # one pull request.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/browser"
          - "@vitest/browser-playwright"
          - "@vitest/coverage-v8"
      # Batch routine dependency bumps to reduce noise. A package whose upgrade
      # carries a checklist in docs/spec/DEPENDENCY_PINS.md is excluded below,
      # or its bump rides this batch and is skimmed as routine instead;
      # scripts/check-dependabot-pin-coverage.mjs holds that pairing rather than
      # this comment.
      non-critical:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@openmined/psi.js"
          - "node-forge"
          - "ssh2"
          - "ssh2-sftp-client"
          - "@microsoft/dev-tunnels-ssh"
          - "peerjs"
          - "peerjs-js-binarypack"
          - "werift"
          - "vitest"
          - "@vitest/browser"
          - "@vitest/browser-playwright"
          - "@vitest/coverage-v8"
          # canonicalize is inlined into a built @alcove/core artifact rather
          # than resolved at runtime, so each bump is an individual,
          # reviewable PR instead of riding along in this batch -- see
          # "Inlined dependencies and their remediation path" in
          # docs/spec/NPM_INSTALL_POLICY.md.
          - "canonicalize"
    ignore:
      # The OpenMined PSI module is vendored, not installed from the registry.
      # Its route is .github/workflows/psi_revendor.yaml, which opens the
      # re-vendor pull request when the fork publishes a Release; the manual
      # route is docs/PREBUILD_REVENDOR.md.
      - dependency-name: "@openmined/psi.js"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]

  # The base images of the two Dockerfiles at the repository root: the default
  # image's node base, and the FIPS variant's Amazon Linux base, which the
  # ignore entries below hold out of this ecosystem.
  - package-ecosystem: docker
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7
    ignore:
      # The FIPS variant's Amazon Linux base is bumped per release, from the
      # release checklist, and when the weekly image scan flags a base CVE with
      # a fix, through "Bumping the FIPS base image" in
      # docs/spec/DEPENDENCY_PINS.md. A Dependabot bump moves the FROM digest
      # alone, while the digest, AL2023_RELEASEVER and the certified provider's
      # NVR pins have to name one Amazon Linux release.
      #
      # No update-types are named: the pin is a tag@sha256: digest, so its bump
      # is a digest move rather than a version change.
      - dependency-name: "amazonlinux"
      # The same base under the registry-qualified name Dockerfile.fips spells.
      - dependency-name: "public.ecr.aws/amazonlinux/amazonlinux"
      # The name Dependabot gives that ECR Public reference when it files a bump.
      - dependency-name: "amazonlinux/amazonlinux"

  # The relay reference's base image. infra/relay/Dockerfile is a single pinned
  # FROM and nothing else -- the digest's only home, since every other file there
  # names the locally built tag -- so a bump here is the one-line digest edit
  # this ecosystem exists for. It ships no code and runs in no workflow, but a
  # coturn advisory reaches a deployment that was stood up from it, and a pull
  # request is what reports one.
  - package-ecosystem: docker
    directory: "/infra/relay"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # The SFTP relay image's node base, the digest the default image pins, in
  # its own copy in packages/sftp-relay/Dockerfile. The relay listens for any
  # browser, so a node advisory reaches it.
  - package-ecosystem: docker
    directory: "/packages/sftp-relay"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # The broker TLS front's nginx image. infra/broker/Dockerfile is a single
  # pinned FROM that install.sh reads and nothing builds, in the same
  # tag@sha256: form as infra/relay/Dockerfile, so a bump here is the same
  # one-line digest edit. The front terminates TLS for signaling and reads the
  # certificate's key, so an nginx advisory reaches it.
  - package-ecosystem: docker
    directory: "/infra/broker"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # The relay host's 443 front, the same nginx image. infra/relay/front/Dockerfile
  # is a single pinned FROM that install.sh builds into the tag its units name.
  # The front parses every client's first bytes on 443, so an nginx advisory
  # reaches it.
  - package-ecosystem: docker
    directory: "/infra/relay/front"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # The BuildKit and QEMU emulator images the release and image smoke builds
  # run. .github/builder-images/Dockerfile is their pins' home, since no
  # Dependabot block reads the action inputs that pass them; a bump here fails
  # scripts/dockerhub-login.test.mjs until the same pull request moves those
  # inputs by hand.
  - package-ecosystem: docker
    directory: "/.github/builder-images"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # The wrangler the Cloudflare Pages upload jobs install from
  # .github/wrangler/package-lock.json before cloudflare/wrangler-action runs.
  # A bump here does not move the wranglerVersion those steps pass:
  # scripts/signed-build-inputs.test.mjs holds it equal to the locked version
  # and fails until the same pull request edits all six steps by hand.
  - package-ecosystem: npm
    directory: "/.github/wrangler"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5

  # GitHub Actions used by the workflows in .github/workflows and the composite
  # actions in .github/actions. Every remote action is pinned to a commit with
  # its release tag in a trailing comment (e.g. actions/checkout@<commit>
  # # v7.0.1), the form Dependabot reads and rewrites. "/" reads the workflows,
  # and each composite action's directory is listed beside it, so the group
  # below moves a pin in both trees in one pull request.
  #
  # scripts/check-action-pin-drift.mjs holds every composite pin identical to a
  # workflow pin, so a bump cannot land on one tree and leave the other stale.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/path-scope"
      - "/.github/actions/setup"
      - "/.github/actions/test-durations"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7
    # A commit pin never moves on its own, so no update type is ignored: a
    # within-major release is the only way a pin picks up a later fix. One group
    # holds every minor and patch action update, so a weekly run opens one pull
    # request for them; each major bump opens its own.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Tool versions a workflow input or a Dockerfile ARG names: the Cosign
  # release the cosign-installer steps pass, the Python the re2js reference
  # comparison sets up, and the development container's AWS CLI.
  # .github/tool-versions/Dockerfile holds each as an image tag, since no
  # Dependabot block reads those consumers; a bump here fails
  # scripts/tool-versions.test.mjs until the same pull request moves the
  # consumer by hand, and an AWS CLI bump also re-verifies the archive digests
  # as .devcontainer/README.md describes.
  - package-ecosystem: docker
    directory: "/.github/tool-versions"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7
    ignore:
      # Python stays on its 3.12 line: a google-re2 release ships wheels for a
      # fixed set of interpreters, and the comparison runs only on a re2js move,
      # so a new minor would land unexercised. Moving it is a hand edit.
      - dependency-name: "library/python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # The google-re2 release the re2js reference comparison installs, read from
  # scripts/re2-reference/requirements.txt by scripts/compare-regex-with-re2.mjs.
  - package-ecosystem: pip
    directory: "/scripts/re2-reference"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The Cloudflare provider in infra/hosted/.terraform.lock.hcl. The opentofu
  # ecosystem, not terraform: the lock file names the provider at
  # registry.opentofu.org, which the terraform ecosystem does not read.
  - package-ecosystem: opentofu
    directory: "/infra/hosted"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
