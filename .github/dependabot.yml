version: 2
updates:
  # Workspace root and all npm packages
  - package-ecosystem: npm
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Supply-chain hardening: never adopt a freshly published release. The
    # cooldown holds a new version until the ecosystem has had time to expose a
    # compromised release (hijacked maintainer token, malicious postinstall)
    # before we ingest it, trading a few days of patch latency for not being the
    # first to pull. It delays routine version bumps only.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5
    groups:
      # Cryptographic dependencies are grouped separately so they are reviewed
      # together and subject to the security review requirement in CONTRIBUTING.md.
      cryptographic:
        patterns:
          - "@openmined/psi.js"
          - "node-forge"
          - "ssh2"
          - "ssh2-sftp-client"
      # The WebRTC stack is grouped (not batched into non-critical) so each
      # bump is checked against its checklist before it merges: the web
      # inbound bound drives peerjs internals, the CLI transport drives
      # werift's RTCPeerConnection and reads its SCTP send queues, and
      # peerjs-js-binarypack's wire format is decoded by both sides of an
      # exchange. The two halves speak one data channel to each other, so a
      # bump on either side is reviewed against both -- see the "Upgrading the
      # PeerJS Stack" and "Upgrading the CLI WebRTC peer" checklists in
      # docs/spec/DEPENDENCY_PINS.md, the same review the SFTP stack gets.
      webrtc-stack:
        patterns:
          - "peerjs"
          - "peerjs-js-binarypack"
          - "werift"
      # The @vitest/* plugins peer-pin the exact vitest version, so an
      # ungrouped major bump arrives as several separate pull requests that
      # each fail their own install and must be landed by hand. Grouped here,
      # with no update-types restriction, so a major moves the whole set in
      # one pull request.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/browser"
          - "@vitest/browser-playwright"
          - "@vitest/coverage-v8"
      # Batch routine dependency bumps to reduce noise. A package whose upgrade
      # carries a checklist in docs/spec/DEPENDENCY_PINS.md is excluded below,
      # or its bump rides this batch and is skimmed as routine instead;
      # scripts/check-dependabot-pin-coverage.mjs holds that pairing rather than
      # this comment.
      non-critical:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@openmined/psi.js"
          - "node-forge"
          - "ssh2"
          - "ssh2-sftp-client"
          - "peerjs"
          - "peerjs-js-binarypack"
          - "werift"
          - "vitest"
          - "@vitest/browser"
          - "@vitest/browser-playwright"
          - "@vitest/coverage-v8"
          # canonicalize is inlined into a built @alcove/core artifact rather
          # than resolved at runtime, so each bump is an individual,
          # reviewable PR instead of riding along in this batch -- see
          # "Inlined dependencies and their remediation path" in
          # docs/spec/DEPENDENCY_PINS.md.
          - "canonicalize"
    ignore:
      # The OpenMined PSI module is vendored; updates require manual review
      # of the tarball and NOTICE file before the lock file is updated.
      - dependency-name: "@openmined/psi.js"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]

  # The base images of the two Dockerfiles at the repository root: the default
  # image's node base, and the FIPS variant's Amazon Linux base, which the
  # ignore entry below holds out of this ecosystem.
  - package-ecosystem: docker
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7
    ignore:
      # The default image's node base is NOT here: its digest-only bumps are the
      # mechanical class this block exists for, and the freeze test in
      # scripts/dockerfile-freeze.test.mjs is what forces the mirrored literal
      # to be reconciled on the same pull request.
      #
      # The FIPS variant's Amazon Linux base is the opposite case, because a
      # move of it is not a one-line digest edit. Dockerfile.fips's FROM digest,
      # its AL2023_RELEASEVER snapshot and the certified provider's NVR pins
      # have to name one Amazon Linux release between them -- the coupling the
      # release-coupling comment above that FROM states and the nodebase stage
      # asserts -- and it also carries a FIPS re-measurement obligation. A
      # version comparison over tag components sees none of that, so this base
      # moves as a coordinated, human-reviewed change worked through
      # "Bumping the FIPS base image" in docs/spec/DEPENDENCY_PINS.md, and the
      # digest freeze stays the pinning mechanism meanwhile.
      #
      # The entry names no update-types at all rather than listing the semver
      # ones: this pin is a tag@sha256: digest, so the bump it receives is a
      # digest move rather than a version change, and exempting no update type
      # is the one shape that cannot leave that case uncovered.
      - dependency-name: "amazonlinux"
      # The same base under the registry-qualified name Dockerfile.fips's FROM
      # spells, held out for the same reason as the entry above.
      - dependency-name: "public.ecr.aws/amazonlinux/amazonlinux"
      # The name Dependabot gives that ECR Public reference when it files a bump.
      - dependency-name: "amazonlinux/amazonlinux"

  # The relay reference's base image. infra/relay/Dockerfile is a single pinned
  # FROM and nothing else -- the digest's only home, since every other file there
  # names the locally built tag -- so a bump here is the one-line digest edit
  # this ecosystem exists for. It ships no code and runs in no workflow, but a
  # coturn advisory reaches a deployment that was stood up from it, and a pull
  # request is what reports one.
  - package-ecosystem: docker
    directory: "/infra/relay"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # The SFTP relay image's node base, the digest the default image pins, in
  # its own copy in packages/sftp-relay/Dockerfile. The relay listens for any
  # browser, so a node advisory reaches it.
  - package-ecosystem: docker
    directory: "/packages/sftp-relay"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # The broker TLS front's nginx image. infra/broker/Dockerfile is a single
  # pinned FROM that install.sh reads and nothing builds, in the same
  # tag@sha256: form as infra/relay/Dockerfile, so a bump here is the same
  # one-line digest edit. The front terminates TLS for signaling and reads the
  # certificate's key, so an nginx advisory reaches it.
  - package-ecosystem: docker
    directory: "/infra/broker"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # The relay host's 443 front, the same nginx image. infra/relay/front/Dockerfile
  # is a single pinned FROM that install.sh builds into the tag its units name.
  # The front parses every client's first bytes on 443, so an nginx advisory
  # reaches it.
  - package-ecosystem: docker
    directory: "/infra/relay/front"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # The wrangler the Cloudflare Pages upload jobs install from
  # .github/wrangler/package-lock.json before cloudflare/wrangler-action runs.
  # A bump here does not move the wranglerVersion those steps pass:
  # scripts/signed-build-inputs.test.mjs holds it equal to the locked version
  # and fails until the same pull request edits all five steps by hand.
  - package-ecosystem: npm
    directory: "/.github/wrangler"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5

  # GitHub Actions used by the workflows in .github/workflows. The actions/*
  # and github/* actions are pinned to a floating major tag (e.g.
  # actions/checkout@v7). The docker/*, aquasecurity/* and sigstore/* actions,
  # which run in the jobs holding the release signing identity or a registry
  # publish credential, and cloudflare/wrangler-action, which holds the Pages
  # deploy token, are pinned to a commit with their release tag in a trailing
  # comment. This block is configured against that path.
  #
  # A pin that also appears in a composite action under .github/actions is not
  # relied upon to be tracked there. Coverage reaches it through the workflow
  # occurrence instead: scripts/check-action-pin-drift.mjs holds every composite
  # pin identical to a workflow pin, so a release or advisory reported on the
  # workflow pin covers the composite occurrence too, and the bump answering it
  # cannot land on the workflow and leave the composite stale.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7
    ignore:
      # An action pinned to a floating major tag (e.g. actions/checkout@v7)
      # already tracks the latest release within that major at runtime. A
      # minor/patch bump PR would only re-pin us to a specific, frozen version
      # (dropping later fixes) and add churn -- so within-major bumps are
      # ignored for these orgs and the major tags float. Major bumps (e.g.
      # checkout v6 -> v7) are NOT ignored and still appear for review.
      #
      # That rationale rests on every pin these entries cover in fact being a
      # floating major -- a property of the workflow trees, held by
      # scripts/check-dependabot-ignore-shape.mjs rather than by this comment.
      # An exact, sha, or branch pin from a listed org fails the build instead
      # of freezing under an ignore that suppresses its every update.
      #
      # An org whose actions are not floating-major pinned must stay off this
      # list for its bumps to be reported -- docker, aquasecurity, sigstore and
      # cloudflare are absent because their actions are pinned to a commit, so
      # no update to them, within a major included, is suppressed here.
      #
      # A new floating-major action from another org should be added here.
      - dependency-name: "actions/*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "github/*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
